<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Study Mode • OAU CBE Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- This is your CSS file -->
    <link rel="stylesheet" href="studymode.css">

    <!-- MathJax Config -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

    <div class="app-container">

        <!-- HEADER -->
        <header>
            <div class="header-left">
                <div class="logo-circle">
                    <img src="/logo.svg" alt="Logo" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\'fas fa-graduation-cap\'></i>'">
                </div>
                <div class="header-text">
                    <h2>Study Mode</h2>
                    <h1>OAU CBE Practice</h1>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-icon"><i class="fas fa-bell"></i></button>
                <button id="themeToggle" class="btn-icon"><i class="fas fa-moon"></i></button>
            </div>
        </header>

        <!-- COURSE SELECTION -->
        <div id="course-selection">
            <h2 class="page-title">Select a course</h2>
            <p class="page-subtitle">Start studying topic by topic.</p>
            
            <div class="course-list">
                <button class="course-btn" onclick="startStudy('PHY 102')">
                    <span class="code">PHY 102</span>
                    <span class="name">General Physics II</span>
                    <span class="status">Click to start</span>
                </button>
                <button class="course-btn" onclick="startStudy('PHY 104')">
                    <span class="code">PHY 104</span>
                    <span class="name">General Physics IV</span>
                    <span class="status">Click to start</span>
                </button>
                <button class="course-btn" onclick="startStudy('CHM 102')">
                    <span class="code">CHM 102</span>
                    <span class="name">Organic Chemistry II</span>
                    <span class="status">Click to start</span>
                </button>
                <button class="course-btn" onclick="startStudy('MTH 102')">
                    <span class="code">MTH 102</span>
                    <span class="name">Elementary Mathematics II</span>
                    <span class="status">Click to start</span>
                </button>
            </div>
        </div>

        <!-- STUDY INTERFACE -->
        <div id="study-screen">
            <button class="back-link" onclick="goBackToCourses()">
                <i class="fas fa-arrow-left"></i> Back to Courses
            </button>

            <div id="question-card" class="question-card">
                <div class="progress-top">
                    <span id="progress-text">Question 1 of 0</span>
                    <span id="score-display">✅ 0/0</span>
                </div>
                <div class="progress-bg">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>

                <div id="question-text" class="question-text" style="margin-top:16px;">Loading question...</div>
                <div id="options-container" class="options-container"></div>
            </div>

            <div class="nav-controls">
                <button id="prev-btn" class="nav-btn prev" disabled>Previous</button>
                <button id="next-btn" class="nav-btn next">Next</button>
            </div>
        </div>

    </div>

    <!-- FLOATING HOME BUTTON -->
    <button class="floating-home-btn" onclick="window.location.href='/app'">
        <i class="fas fa-home"></i> Home
    </button>

    <!-- IMPORTANT: This loads your actual question data. DO NOT REMOVE -->
    <script src="studymode.js"></script>

    <!-- Page Logic Script -->
    <script>
        /* ================= THEME TOGGLE ================= */
        const themeToggle = document.getElementById('themeToggle');
        const icon = themeToggle.querySelector('i');
        
        // Check saved theme
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            icon.className = 'fas fa-sun';
        }

        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                icon.className = 'fas fa-sun';
                localStorage.setItem('theme', 'light');
            } else {
                icon.className = 'fas fa-moon';
                localStorage.setItem('theme', 'dark');
            }
        });

        /* ================= NAVIGATION ================= */
        function startStudy(courseCode) {
            document.getElementById('course-selection').style.display = 'none';
            document.getElementById('study-screen').style.display = 'block';
            
            // Trigger studymode.js to load course data
            if(typeof loadCourse === 'function') {
                loadCourse(courseCode);
            } else {
                document.getElementById('question-text').innerText = "Loaded: " + courseCode;
                document.getElementById('progress-text').innerText = "Question 1 of 10";
            }
        }

        function goBackToCourses() {
            document.getElementById('course-selection').style.display = 'block';
            document.getElementById('study-screen').style.display = 'none';
        }

        /* ================= PREV / NEXT BUTTONS ================= */
        document.getElementById('next-btn').addEventListener('click', function() {
            // Calls your studymode.js logic if it exists
            if(typeof nextQuestion === 'function') {
                nextQuestion();
            } else {
                console.log("Next button clicked (no JS attached)");
            }
        });

        document.getElementById('prev-btn').addEventListener('click', function() {
            if(typeof prevQuestion === 'function') {
                prevQuestion();
            }
        });
    </script>
</body>
</html>
