<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Study Mode • OAU CBE Practice</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="studymode.css">

    <!-- MathJax Configuration -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [
                    ['$', '$'],
                    ['\\(', '\\)']
                ],
                displayMath: [
                    ['$$', '$$'],
                    ['\\[', '\\]']
                ],
                packages: ['base', 'ams']
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
                processHtmlClass: 'mathjax-process'
            },
            startup: {
                typeset: false
            }
        };
    </script>
    
    <!-- MathJax Library -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
</head>
<body>

    <div class="app-container">

        <!-- HEADER -->
        <header>
            <div class="header-left">
                <div class="logo-circle">
                    <img src="/logo.svg" alt="Logo" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\'fas fa-graduation-cap\'></i>'">
                </div>
                <div class="header-text">
                    <h2>Study Mode</h2>
                    <h1>OAU CBE Practice</h1>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-icon" aria-label="Notifications">
                    <i class="fas fa-bell"></i>
                </button>
                <button id="themeToggle" class="btn-icon" onclick="toggleTheme()" aria-label="Toggle theme">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
            </div>
        </header>

        <!-- COURSE SELECTION -->
        <div id="course-selection-screen">
            <h2 class="page-title">Select a course</h2>
            <p class="page-subtitle">Start studying topic by topic.</p>

            <div class="course-list" id="courseGrid">
                <!-- Courses rendered by JS -->
            </div>
        </div>

        <!-- STUDY INTERFACE -->
        <div id="study-screen" style="display:none;">
            <button id="back-to-menu-btn" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Courses
            </button>

            <div id="question-card" class="question-card loading">
                <div class="loading-overlay">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>Loading questions...</span>
                </div>

                <div class="progress-top">
                    <span id="progress-text">Question 1 of 0</span>
                    <span id="score-display">✅ 0/0</span>
                </div>
                <div class="progress-bg">
                    <div id="progress-fill" class="progress-fill" style="width:0%;"></div>
                </div>

                <div id="question-text" class="question-text" style="margin-top:16px;">
                    Loading question...
                </div>

                <div id="options-container" class="options-container"></div>

                <div id="solution-container" class="solution-container" style="display:none;">
                    <button id="toggle-solution-btn" class="toggle-solution-btn">💡 Show Solution</button>
                    <div id="solution-text" class="solution-text"></div>
                </div>
            </div>

            <div class="nav-controls">
                <button id="prev-btn" class="nav-btn prev" disabled>← Previous</button>
                <button id="next-btn" class="nav-btn next">Next →</button>
            </div>
        </div>

    </div>

    <!-- FLOATING HOME BUTTON -->
    <button class="floating-home-btn" onclick="window.location.href='/app'">
        <i class="fas fa-home"></i> Home
    </button>

    <!-- JAVASCRIPT -->
    <script src="studymode.js"></script>

</body>
</html>
