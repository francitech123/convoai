<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Study Mode • OAU CBE Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="studymode.css">

    <!-- MathJax Configuration -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            options: {
                ignoreHtmlClass: 'no-mathjax',
                processHtmlClass: 'mathjax-process'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

    <div class="app-container">

        <!-- ==================== HEADER ==================== -->
        <header>
            <div class="header-left">
                <div class="logo">
                    <img src="/logo.svg" alt="OAU CBE Practice" onerror="this.style.display='none';this.parentElement.textContent='O'">
                </div>
                <div>
                  
            </div>
            <div class="header-actions">
                <button onclick="window.location.href='/app'" class="back-home" title="Back to Home">
                    <i class="fas fa-home"></i> Home
                </button>
                <button onclick="toggleTheme()" title="Toggle Theme">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
            </div>
        </header>

        <!-- ==================== COURSE SELECTION ==================== 
            <p class="subtitle">Select a course to start studying topic by topic.</p>
            <div class="course-grid" id="courseGrid">
                <button class="course-btn" data-code="PHY 102">
                    <span class="course-content">
                        <span class="course-code">PHY 102</span>
                        <span class="course-name">General Physics II (Electricity &amp; Magnetism)</span>
                        <span class="course-status">Click to start</span>
                    </span>
                    <span class="course-spinner"><i class="fas fa-spinner fa-spin"></i></span>
                </button>
                <button class="course-btn" data-code="PHY 104">
                    <span class="course-content">
                        <span class="course-code">PHY 104</span>
                        <span class="course-name">General Physics IV (Waves &amp; Optics)</span>
                        <span class="course-status">Click to start</span>
                    </span>
                    <span class="course-spinner"><i class="fas fa-spinner fa-spin"></i></span>
                </button>
                <button class="course-btn" data-code="CHM 102">
                    <span class="course-content">
                        <span class="course-code">CHM 102</span>
                        <span class="course-name">Organic Chemistry II</span>
                        <span class="course-status">Click to start</span>
                    </span>
                    <span class="course-spinner"><i class="fas fa-spinner fa-spin"></i></span>
                </button>
                <button class="course-btn" data-code="MTH 102">
                    <span class="course-content">
                        <span class="course-code">MTH 102</span>
                        <span class="course-name">Elementary Mathematics II (Calculus)</span>
                        <span class="course-status">Click to start</span>
                    </span>
                    <span class="course-spinner"><i class="fas fa-spinner fa-spin"></i></span>
                </button>
                <button class="course-btn" data-code="MTH 104">
                    <span class="course-content">
                        <span class="course-code">MTH 104</span>
                        <span class="course-name">Elementary Mathematics IV (Matrices)</span>
                        <span class="course-status">Click to start</span>
                    </span>
                    <span class="course-spinner"><i class="fas fa-spinner fa-spin"></i></span>
                </button>
                <button class="course-btn" data-code="BIO 102">
                    <span class="course-content">
                        <span class="course-code">BIO 102</span>
                        <span class="course-name">General Biology II</span>
                        <span class="course-status">Click to start</span>
                    </span>
                    <span class="course-spinner"><i class="fas fa-spinner fa-spin"></i></span>
                </button>
            </div>
        </div>

        <!-- ==================== STUDY INTERFACE ==================== -->
        <div id="study-screen" style="display:none;">
            <button id="back-to-menu-btn" class="back-btn">← Back to Courses</button>

            <div id="question-card" class="question-card">
                <div class="loading-overlay">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>Loading questions...</span>
                </div>

                <!-- Progress -->
                <div class="progress-container">
                    <div class="progress-top">
                        <span id="progress-text">Question 1 of 0</span>
                        <span id="score-display">✅ 0/0</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="progress-fill" class="progress-bar-fill" style="width:0%;"></div>
                    </div>
                </div>

                <div id="question-text" class="question-text mathjax-process">Loading question...</div>

                <div id="options-container" class="options-container"></div>

                <div id="solution-container" class="solution-container" style="display:none;">
                    <button id="toggle-solution-btn" class="toggle-solution-btn">💡 Show Solution</button>
                    <div id="solution-text" class="solution-text mathjax-process"></div>
                </div>
            </div>

            <div class="navigation-controls">
                <button id="prev-btn" class="nav-btn prev" disabled>
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
                <button id="next-btn" class="nav-btn next">
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>

    </div>

    <script src="studymode.js"></script>
</body>
</html>
