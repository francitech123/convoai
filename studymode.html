<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Study Mode • OAU CBE Practice</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="studymode.css">

    <!-- MathJax Configuration -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            options: {
                enableMenu: false
            }
        };
    </script>
    
    <!-- MathJax Library -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

    <div class="app-container">

        <!-- HEADER -->
        <header>
            <div class="header-left">
                <div class="logo-circle">
                    <img src="/logo.svg" alt="Logo" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\'fas fa-graduation-cap\'></i>'">
                </div>
                <div class="header-text">
                    <h2>Study Mode</h2>
                    <h1>OAU CBE Practice</h1>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="toggleCalculator()" aria-label="Calculator">
                    <i class="fas fa-calculator"></i>
                </button>
                <button class="btn-icon" aria-label="Notifications">
                    <i class="fas fa-bell"></i>
                </button>
                <button id="themeToggle" class="btn-icon" onclick="toggleTheme()" aria-label="Toggle theme">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
            </div>
        </header>

        <!-- CALCULATOR MODAL -->
        <div id="calculator-modal" class="calculator-modal" style="display:none;">
            <div class="calculator-container">
                <div class="calculator-header">
                    <h3><i class="fas fa-calculator"></i> Scientific Calculator</h3>
                    <button onclick="toggleCalculator()" class="calc-close-btn" aria-label="Close calculator">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <div class="calculator-display">
                    <input type="text" id="calc-display" readonly placeholder="0" value="">
                    <div id="calc-history" class="calc-history"></div>
                </div>
                
                <div class="calculator-buttons">
                    <!-- Row 1: Scientific Functions -->
                    <button onclick="calcInput('sin(')" class="calc-btn function">sin</button>
                    <button onclick="calcInput('cos(')" class="calc-btn function">cos</button>
                    <button onclick="calcInput('tan(')" class="calc-btn function">tan</button>
                    <button onclick="calcInput('log(')" class="calc-btn function">log</button>
                    
                    <!-- Row 2: More Functions -->
                    <button onclick="calcInput('ln(')" class="calc-btn function">ln</button>
                    <button onclick="calcInput('sqrt(')" class="calc-btn function">√</button>
                    <button onclick="calcInput('^')" class="calc-btn function">xʸ</button>
                    <button onclick="calcInput('(')" class="calc-btn function">(</button>
                    
                    <!-- Row 3: Functions and Parentheses -->
                    <button onclick="calcInput(')')" class="calc-btn function">)</button>
                    <button onclick="calcInput('PI')" class="calc-btn function">π</button>
                    <button onclick="calcInput('E')" class="calc-btn function">e</button>
                    <button onclick="calcInput('!')" class="calc-btn function">x!</button>
                    
                    <!-- Row 4: Clear and Operations -->
                    <button onclick="calcClear()" class="calc-btn clear">AC</button>
                    <button onclick="calcBackspace()" class="calc-btn operator">⌫</button>
                    <button onclick="calcInput('%')" class="calc-btn operator">%</button>
                    <button onclick="calcInput('/')" class="calc-btn operator">÷</button>
                    
                    <!-- Row 5: Numbers 7-9 and Multiply -->
                    <button onclick="calcInput('7')" class="calc-btn number">7</button>
                    <button onclick="calcInput('8')" class="calc-btn number">8</button>
                    <button onclick="calcInput('9')" class="calc-btn number">9</button>
                    <button onclick="calcInput('*')" class="calc-btn operator">×</button>
                    
                    <!-- Row 6: Numbers 4-6 and Subtract -->
                    <button onclick="calcInput('4')" class="calc-btn number">4</button>
                    <button onclick="calcInput('5')" class="calc-btn number">5</button>
                    <button onclick="calcInput('6')" class="calc-btn number">6</button>
                    <button onclick="calcInput('-')" class="calc-btn operator">−</button>
                    
                    <!-- Row 7: Numbers 1-3 and Add -->
                    <button onclick="calcInput('1')" class="calc-btn number">1</button>
                    <button onclick="calcInput('2')" class="calc-btn number">2</button>
                    <button onclick="calcInput('3')" class="calc-btn number">3</button>
                    <button onclick="calcInput('+')" class="calc-btn operator">+</button>
                    
                    <!-- Row 8: Zero, Decimal, Equals -->
                    <button onclick="calcInput('0')" class="calc-btn number zero">0</button>
                    <button onclick="calcInput('.')" class="calc-btn number">.</button>
                    <button onclick="calcEquals()" class="calc-btn equals">=</button>
                </div>
            </div>
        </div>

        <!-- COURSE SELECTION -->
        <div id="course-selection-screen">
            <h2 class="page-title">Select a course</h2>
            <p class="page-subtitle">Start studying topic by topic.</p>
            <div class="course-list" id="courseGrid"></div>
        </div>

        <!-- STUDY INTERFACE -->
        <div id="study-screen" style="display:none;">
            <button id="back-to-menu-btn" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Courses
            </button>

            <!-- Current Course Banner -->
            <div id="current-course-banner" class="current-course-banner">
                <div class="course-banner-icon" id="course-banner-icon">📚</div>
                <div class="course-banner-info">
                    <h3 id="course-banner-code">Course Code</h3>
                    <p id="course-banner-name">Course Name</p>
                </div>
            </div>

            <div id="question-card" class="question-card loading">
                <div class="loading-overlay">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>Loading questions...</span>
                </div>

                <div class="progress-top">
                    <span id="progress-text">Question 1 of 0</span>
                    <span id="score-display">✅ 0/0</span>
                </div>
                <div class="progress-bg">
                    <div id="progress-fill" class="progress-fill" style="width:0%;"></div>
                </div>

                <div id="question-text" class="question-text" style="margin-top:16px;"></div>
                <div id="options-container" class="options-container"></div>

                <div id="solution-container" class="solution-container" style="display:none;">
                    <button id="toggle-solution-btn" class="toggle-solution-btn">💡 Show Solution</button>
                    <div id="solution-text" class="solution-text"></div>
                </div>
            </div>

            <div class="nav-controls">
                <button id="prev-btn" class="nav-btn prev" disabled>← Previous</button>
                <button id="next-btn" class="nav-btn next">Next →</button>
            </div>
        </div>

    </div>

    <!-- FLOATING HOME BUTTON -->
    <button class="floating-home-btn" onclick="window.location.href='/app'">
        <i class="fas fa-home"></i> Home
    </button>

    <!-- External JavaScript -->
    <script src="studymode.js"></script>

</body>
</html>
