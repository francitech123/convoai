<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Study Mode Simulator</title>
    <link rel="stylesheet" href="studymode.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Physics Past Questions</h1>
            <div class="progress-container">
                <span id="progress-text">Question 1 of 72</span>
                <div class="progress-bar-bg">
                    <div id="progress-fill" class="progress-bar-fill" style="width: 1.38%;"></div>
                </div>
            </div>
        </header>

        <main>
            <div id="question-card" class="question-card">
                <!-- Content is injected by JavaScript -->
                <div id="question-text" class="question-text">Loading question...</div>
                
                <div id="options-container" class="options-container">
                    <!-- Options injected here -->
                </div>

                <!-- Dropdown solution area -->
                <div id="solution-container" class="solution-container" style="display: none;">
                    <button id="toggle-solution-btn" class="toggle-solution-btn">Show Solution</button>
                    <div id="solution-text" class="solution-text"></div>
                </div>
            </div>

            <div class="navigation-controls">
                <button id="prev-btn" class="nav-btn" disabled>Previous</button>
                <button id="next-btn" class="nav-btn">Next</button>
            </div>
        </main>
    </div>

    <script src="studymode.js"></script>
</body>
</html>
