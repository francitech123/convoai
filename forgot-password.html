<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>Forgot Password • OAU CBE Practice</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',sans-serif}
    :root{
      --primary:#1e3a8a;--primary-light:#3b82f6;--accent:#10b981;
      --bg:#ffffff;--bg-soft:#f8fafc;--card:#ffffff;--card-2:#f8fafc;
      --border:#e2e8f0;--text:#0f172a;--text-secondary:#475569;
      --danger:#ef4444;--success:#10b981;--warning:#f59e0b;
      --shadow:0 18px 40px rgba(0,0,0,.08);--brand-gradient:linear-gradient(135deg,#1e3a8a,#3b82f6)
    }
    body{background:#ffffff;color:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Inter',sans-serif}
    .auth-wrap{width:100%;max-width:440px;margin:0 auto}
    .auth-card{background:#ffffff;border:1px solid #e2e8f0;border-radius:32px;padding:36px 28px;box-shadow:0 20px 60px rgba(0,0,0,.06);text-align:center}
    .auth-logo{text-align:center;margin-bottom:20px}
    .auth-logo img{width:72px;height:72px;object-fit:contain}
    .auth-logo h1{font-size:1.3rem;margin-top:8px;color:#0f172a}
    .auth-logo p{color:#64748b;font-size:.85rem}
    .auth-logo .subtitle{color:#3b82f6;font-weight:700}

    .icon-big{font-size:3rem;color:#f59e0b;margin-bottom:12px;display:block}
    .page-title{font-size:1.2rem;font-weight:700;color:#0f172a;margin-bottom:6px}
    .page-desc{color:#64748b;font-size:.85rem;margin-bottom:20px;line-height:1.5}

    .form-group{margin-bottom:14px;text-align:left}
    .form-group label{display:block;margin-bottom:5px;font-weight:600;font-size:.75rem;color:#475569}
    .form-group input,.form-group select{width:100%;padding:12px 14px;background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;color:#0f172a;font-size:.88rem;font-family:inherit;transition:all .2s}
    .form-group input:focus,.form-group select:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1);background:#ffffff}
    .form-group input::placeholder{color:#94a3b8;opacity:.8}

    .password-wrap{position:relative}
    .password-wrap input{padding-right:48px}
    .toggle-pwd{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;cursor:pointer;font-size:.9rem;transition:color .2s}
    .toggle-pwd:hover{color:#0f172a}

    .pwd-strength{margin-top:6px;display:flex;gap:6px;align-items:center}
    .strength-bar{flex:1;height:4px;background:#e2e8f0;border-radius:4px;overflow:hidden}
    .strength-fill{height:100%;width:0;transition:width .3s;border-radius:4px}
    .strength-text{font-size:.6rem;font-weight:600;min-width:50px}
    .strength-text.weak{color:#ef4444}.strength-text.fair{color:#f59e0b}.strength-text.good{color:#3b82f6}.strength-text.strong{color:#10b981}

    .pwd-match{margin-top:4px;font-size:.65rem;display:none;align-items:center;gap:6px}
    .pwd-match.match{color:#10b981;display:flex}
    .pwd-match.nomatch{color:#ef4444;display:flex}

    .btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:700;font-size:.95rem;cursor:pointer;transition:all .2s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-primary{background:linear-gradient(135deg,#1e3a8a,#3b82f6);color:#fff}
    .btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 25px rgba(59,130,246,.3)}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed}
    .btn-secondary{background:#f1f5f9;color:#0f172a}
    .btn-secondary:hover:not(:disabled){background:#e2e8f0;transform:translateY(-2px)}
    .btn-secondary:disabled{opacity:.6;cursor:not-allowed}

    .alert{padding:10px 14px;border-radius:10px;margin-bottom:14px;display:none;font-size:.8rem;text-align:center}
    .alert-error{background:rgba(239,68,68,.06);color:#ef4444;border:1px solid rgba(239,68,68,.15)}
    .alert-success{background:rgba(16,185,129,.06);color:#10b981;border:1px solid rgba(16,185,129,.15)}
    .alert.show{display:block}

    .links{text-align:center;margin-top:16px}
    .links a{color:#64748b;text-decoration:none;font-size:.8rem;transition:color .2s}
    .links a:hover{color:#3b82f6}

    .reset-section{display:none;margin-top:20px;padding-top:20px;border-top:1px solid #e2e8f0}
    .reset-section.show{display:block}

    .back-to-login{display:inline-flex;align-items:center;gap:6px;color:#3b82f6;text-decoration:none;font-size:.82rem;margin-top:4px}
    .back-to-login:hover{text-decoration:underline;color:#1e3a8a}

    .identity-verified{background:rgba(16,185,129,.06);border:1px solid #10b981;border-radius:12px;padding:12px;margin-bottom:16px;text-align:left;display:none}
    .identity-verified.show{display:block}
    .identity-verified p{color:#10b981;font-weight:600;font-size:.85rem}
    .identity-verified .small{color:#64748b;font-weight:400;font-size:.75rem}

    .loading-spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    @media(max-width:480px){.auth-card{padding:24px 16px}}
  </style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="/logo.svg" alt="OAU CBE Practice Logo">
      <h1>OAU <span class="subtitle">CBE</span> Practice</h1>
      <p>Reset your password</p>
    </div>

    <span class="icon-big"><i class="fas fa-key"></i></span>
    <div class="page-title">Forgot Password?</div>
    <p class="page-desc">Enter your details to verify your identity and reset your password.</p>

    <div class="alert alert-error" id="errorAlert"></div>
    <div class="alert alert-success" id="successAlert"></div>

    <!-- IDENTITY VERIFICATION SECTION -->
    <div id="identitySection">
      <div class="form-group">
        <label><i class="fas fa-user"></i> Username <span style="color:#ef4444">*</span></label>
        <input type="text" id="identifier" placeholder="Enter your username" autocomplete="off">
      </div>

      <div class="form-group">
        <label><i class="fas fa-question-circle"></i> Security Question <span style="color:#ef4444">*</span></label>
        <select id="securityQuestion">
          <option value="">Select your security question</option>
          <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
          <option value="What is the name of your first pet?">What is the name of your first pet?</option>
          <option value="What city were you born in?">What city were you born in?</option>
          <option value="What is your favorite food?">What is your favorite food?</option>
          <option value="What was your first car?">What was your first car?</option>
          <option value="What is your favorite book?">What is your favorite book?</option>
          <option value="What is your best friend's name?">What is your best friend's name?</option>
          <option value="What is your childhood nickname?">What is your childhood nickname?</option>
        </select>
      </div>

      <div class="form-group">
        <label><i class="fas fa-lock"></i> Security Answer <span style="color:#ef4444">*</span></label>
        <input type="text" id="securityAnswer" placeholder="Enter your security answer">
      </div>

      <button class="btn btn-primary" id="verifyBtn" onclick="verifyIdentity()">
        <i class="fas fa-check-circle"></i> Verify Identity
      </button>
    </div>

    <!-- RESET PASSWORD SECTION -->
    <div class="reset-section" id="resetSection">
      <div class="identity-verified" id="verifiedBadge">
        <p><i class="fas fa-check-circle"></i> Identity Verified!</p>
        <div class="small">You can now reset your password.</div>
      </div>

      <div class="form-group">
        <label><i class="fas fa-lock"></i> New Password <span style="color:#ef4444">*</span></label>
        <div class="password-wrap">
          <input type="password" id="newPassword" placeholder="Min 8 characters" oninput="checkPasswordStrength()">
          <button type="button" class="toggle-pwd" onclick="togglePassword('newPassword','newPwdIcon')">
            <i class="fas fa-eye" id="newPwdIcon"></i>
          </button>
        </div>
        <div class="pwd-strength" id="strengthContainer" style="display:none">
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <span class="strength-text" id="strengthText">Weak</span>
        </div>
      </div>

      <div class="form-group">
        <label><i class="fas fa-lock"></i> Confirm New Password <span style="color:#ef4444">*</span></label>
        <div class="password-wrap">
          <input type="password" id="confirmPassword" placeholder="Confirm your new password" oninput="checkPasswordMatch()">
          <button type="button" class="toggle-pwd" onclick="togglePassword('confirmPassword','confirmPwdIcon')">
            <i class="fas fa-eye" id="confirmPwdIcon"></i>
          </button>
        </div>
        <div class="pwd-match" id="matchContainer" style="display:none">
          <span id="matchText">Passwords match</span>
        </div>
      </div>

      <button class="btn btn-primary" id="resetBtn" onclick="resetPassword()">
        <i class="fas fa-save"></i> Reset Password
      </button>
    </div>

    <div class="links">
      <a href="/app" class="back-to-login"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </div>
  </div>
</div>

<script>
// ==================== CONFIGURATION ====================
const API_BASE = 'https://oau-exam-api.onrender.com/api';
const qs = id => document.getElementById(id);

// ==================== STATE ====================
let verifiedUsername = '';
let verifiedUserId = '';

// ==================== PASSWORD STRENGTH ====================
function checkPasswordStrength() {
  const password = qs('newPassword').value;
  const container = qs('strengthContainer');
  const fill = qs('strengthFill');
  const text = qs('strengthText');

  if (password.length === 0) {
    container.style.display = 'none';
    return;
  }
  container.style.display = 'flex';

  let strength = 0;
  if (password.length >= 8) strength++;
  if (/[a-z]/.test(password)) strength++;
  if (/[A-Z]/.test(password)) strength++;
  if (/[0-9]/.test(password)) strength++;
  if (/[^a-zA-Z0-9]/.test(password)) strength++;

  let pct = 0, msg = '', cls = '';
  if (strength <= 2) { pct = 25; msg = 'Weak'; cls = 'weak'; }
  else if (strength <= 3) { pct = 50; msg = 'Fair'; cls = 'fair'; }
  else if (strength <= 4) { pct = 75; msg = 'Good'; cls = 'good'; }
  else { pct = 100; msg = 'Strong'; cls = 'strong'; }

  fill.style.width = pct + '%';
  text.textContent = msg;
  text.className = 'strength-text ' + cls;

  checkPasswordMatch();
}
window.checkPasswordStrength = checkPasswordStrength;

// ==================== PASSWORD MATCH ====================
function checkPasswordMatch() {
  const password = qs('newPassword').value;
  const confirm = qs('confirmPassword').value;
  const container = qs('matchContainer');
  const text = qs('matchText');

  if (confirm.length === 0 || password.length === 0) {
    container.style.display = 'none';
    return;
  }

  if (password === confirm) {
    container.className = 'pwd-match match';
    text.textContent = '✓ Passwords match';
  } else {
    container.className = 'pwd-match nomatch';
    text.textContent = '✗ Passwords do not match';
  }
  container.style.display = 'flex';
}
window.checkPasswordMatch = checkPasswordMatch;

// ==================== TOGGLE PASSWORD ====================
function togglePassword(inputId, iconId) {
  const input = qs(inputId);
  const icon = qs(iconId);
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'fas fa-eye';
  }
}
window.togglePassword = togglePassword;

// ==================== SHOW ALERTS ====================
function showError(msg) {
  const el = qs('errorAlert');
  el.textContent = '❌ ' + msg;
  el.classList.add('show');
  qs('successAlert').classList.remove('show');
}

function showSuccess(msg) {
  const el = qs('successAlert');
  el.textContent = '✅ ' + msg;
  el.classList.add('show');
  qs('errorAlert').classList.remove('show');
}

function hideAlerts() {
  qs('errorAlert').classList.remove('show');
  qs('successAlert').classList.remove('show');
}

// ==================== VERIFY IDENTITY ====================
async function verifyIdentity() {
  const identifier = qs('identifier').value.trim();
  const securityQuestion = qs('securityQuestion').value;
  const securityAnswer = qs('securityAnswer').value.trim();

  if (!identifier) { showError('Please enter your username'); return; }
  if (!securityQuestion) { showError('Please select your security question'); return; }
  if (!securityAnswer) { showError('Please enter your security answer'); return; }

  const btn = qs('verifyBtn');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
  btn.disabled = true;
  hideAlerts();

  try {
    let username = identifier;

    // If it contains @, try to find by email
    if (identifier.includes('@')) {
      const userResponse = await fetch(API_BASE + '/auth/find-by-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: identifier })
      });
      const userData = await userResponse.json();
      if (userData.success && userData.username) {
        username = userData.username;
      } else {
        showError('No account found with that email address');
        btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify Identity';
        btn.disabled = false;
        return;
      }
    }

    const response = await fetch(API_BASE + '/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: username,
        securityQuestion: securityQuestion,
        securityAnswer: securityAnswer
      })
    });

    const data = await response.json();

    if (response.ok && data.success) {
      verifiedUsername = username;
      verifiedUserId = data.userId;

      showSuccess('Identity verified! Enter your new password below.');

      qs('identitySection').style.opacity = '0.4';
      qs('identitySection').style.pointerEvents = 'none';
      qs('resetSection').classList.add('show');
      document.getElementById('verifiedBadge').classList.add('show');
      qs('newPassword').focus();

    } else {
      showError(data.error || 'Verification failed. Please check your details.');
      btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify Identity';
      btn.disabled = false;
    }
  } catch (e) {
    console.error('Verification error:', e);
    showError('Connection error. Please try again.');
    btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify Identity';
    btn.disabled = false;
  }
}
window.verifyIdentity = verifyIdentity;

// ==================== RESET PASSWORD ====================
async function resetPassword() {
  const newPassword = qs('newPassword').value.trim();
  const confirmPassword = qs('confirmPassword').value.trim();

  if (!newPassword) { showError('Please enter a new password'); return; }
  if (newPassword.length < 8) { showError('Password must be at least 8 characters'); return; }
  if (newPassword !== confirmPassword) { showError('Passwords do not match'); return; }

  const btn = qs('resetBtn');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';
  btn.disabled = true;
  hideAlerts();

  try {
    const response = await fetch(API_BASE + '/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: verifiedUsername,
        securityQuestion: qs('securityQuestion').value,
        securityAnswer: qs('securityAnswer').value.trim(),
        newPassword: newPassword
      })
    });

    const data = await response.json();

    if (response.ok && data.success) {
      showSuccess('Password reset successful! Redirecting to login...');
      setTimeout(() => {
        window.location.href = '/app';
      }, 2000);
    } else {
      showError(data.error || 'Password reset failed. Please try again.');
      btn.innerHTML = '<i class="fas fa-save"></i> Reset Password';
      btn.disabled = false;
    }
  } catch (e) {
    console.error('Reset error:', e);
    showError('Connection error. Please try again.');
    btn.innerHTML = '<i class="fas fa-save"></i> Reset Password';
    btn.disabled = false;
  }
}
window.resetPassword = resetPassword;

// ==================== KEYBOARD SHORTCUTS ====================
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    if (!qs('resetSection').classList.contains('show')) {
      verifyIdentity();
    } else {
      resetPassword();
    }
  }
});

// ==================== EXPOSE GLOBALLY ====================
window.verifyIdentity = verifyIdentity;
window.resetPassword = resetPassword;
window.togglePassword = togglePassword;
window.checkPasswordStrength = checkPasswordStrength;
window.checkPasswordMatch = checkPasswordMatch;
</script>
</body>
</html>
