<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>Page Not Found • OAU CBE Practice</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Inter',system-ui,-apple-system,sans-serif}
    :root{
      --primary:#1e3a8a;--primary-light:#3b82f6;--accent:#10b981;--accent-2:#06b6d4;
      --bg:#0f172a;--bg-soft:#111c33;--card:#1e293b;--card-2:#152033;--border:#334155;
      --text:#f1f5f9;--text-secondary:#94a3b8;--danger:#ef4444;--warning:#f59e0b;--success:#10b981;
      --shadow:0 18px 40px rgba(0,0,0,.28);--brand-gradient:linear-gradient(135deg,#1e3a8a,#3b82f6)
    }
    body.light-mode{
      --bg:#f4f7fb;--bg-soft:#edf3fb;--card:#ffffff;--card-2:#f8fbff;--border:#d7e2ef;
      --text:#0f172a;--text-secondary:#526173;--shadow:0 16px 36px rgba(15,23,42,.08)
    }
    body{background:radial-gradient(circle at top right,rgba(59,130,246,.12),transparent 25%),linear-gradient(180deg,var(--bg),#0b1324 100%);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    
    .error-wrap{width:100%;max-width:560px;margin:0 auto}
    .error-card{background:var(--card);border:1px solid var(--border);border-radius:32px;padding:40px 32px;text-align:center;box-shadow:var(--shadow)}
    .error-logo{margin-bottom:24px}
    .error-logo img{width:72px;height:72px;object-fit:contain}
    .error-code{font-size:6rem;font-weight:900;background:var(--brand-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;margin-bottom:8px}
    .error-title{font-size:1.4rem;font-weight:700;color:var(--text);margin-bottom:8px}
    .error-desc{color:var(--text-secondary);font-size:.9rem;line-height:1.6;margin-bottom:24px;max-width:400px;margin-left:auto;margin-right:auto}
    .error-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
    .btn{border:none;border-radius:14px;padding:12px 24px;font-weight:700;font-size:.85rem;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-family:inherit}
    .btn-primary{background:var(--brand-gradient);color:#fff}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(59,130,246,.35)}
    .btn-soft{background:var(--border);color:var(--text)}
    .btn-soft:hover{background:var(--card-2);transform:translateY(-2px)}
    .btn-outline{background:transparent;border:2px solid var(--border);color:var(--text)}
    .btn-outline:hover{border-color:var(--primary-light);color:var(--primary-light);transform:translateY(-2px)}
    
    .error-suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
    @media(max-width:480px){.error-suggestions{grid-template-columns:1fr}}
    .suggestion-item{background:var(--bg-soft);border-radius:14px;padding:12px 16px;text-align:left;transition:all .2s;cursor:pointer;border:1px solid var(--border)}
    .suggestion-item:hover{background:var(--card-2);border-color:var(--primary-light)}
    .suggestion-item i{color:var(--primary-light);margin-right:8px;width:20px;text-align:center}
    .suggestion-item span{color:var(--text-secondary);font-size:.8rem;font-weight:500}
    .suggestion-item:hover span{color:var(--text)}
    
    .error-footer{margin-top:20px;text-align:center}
    .error-footer a{color:var(--text-secondary);text-decoration:none;font-size:.75rem;transition:color .2s}
    .error-footer a:hover{color:var(--primary-light)}
    .error-footer .divider{width:40px;height:1px;background:var(--border);margin:12px auto}
    
    @keyframes float{
      0%{transform:translateY(0px)}
      50%{transform:translateY(-10px)}
      100%{transform:translateY(0px)}
    }
    .float-icon{animation:float 3s ease-in-out infinite;display:inline-block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .error-card{animation:fadeIn .5s ease}
    
    .bottom-nav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,23,42,.95);border-top:1px solid var(--border);display:flex;justify-content:center;z-index:99;backdrop-filter:blur(16px)}
    body.light-mode .bottom-nav{background:rgba(244,247,251,.95)}
    .bottom-nav-inner{width:min(100%,1280px);display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
    .nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text-secondary);text-decoration:none;padding:8px 4px;border-radius:14px;font-size:.76rem;font-weight:700}
    .nav-item i{font-size:1.1rem}.nav-item.active{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-light))}
    .chat-fab{position:fixed;right:20px;bottom:88px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#10b981,#059669);color:#fff;text-decoration:none;box-shadow:0 10px 24px rgba(16,185,129,.35);z-index:98}
    
    @media(max-width:480px){.error-card{padding:24px 16px}.error-code{font-size:4rem}.error-title{font-size:1.1rem}.btn{padding:10px 18px;font-size:.78rem}}
  </style>
</head>
<body>

<div class="error-wrap">
  <div class="error-card">
    <!-- Logo -->
    <div class="error-logo">
      <img src="/logo.svg" alt="OAU CBE Practice">
    </div>

    <!-- Error Content -->
    <div class="error-code">404</div>
    <div class="error-title">🔄 Page Not Found</div>
    <div class="error-desc">
      Oops! The page you're looking for doesn't exist or has been moved. 
      Let's get you back on track.
    </div>

    <!-- Action Buttons -->
    <div class="error-actions">
      <a href="/app" class="btn btn-primary">
        <i class="fas fa-home"></i> Dashboard
      </a>
      <a href="/exam" class="btn btn-soft">
        <i class="fas fa-pen"></i> Exam Mode
      </a>
      <a href="javascript:history.back()" class="btn btn-outline">
        <i class="fas fa-arrow-left"></i> Go Back
      </a>
    </div>

    <!-- Quick Suggestions -->
    <div class="error-suggestions">
      <div class="suggestion-item" onclick="window.location.href='/app'">
        <i class="fas fa-th-large"></i>
        <span>Dashboard</span>
      </div>
      <div class="suggestion-item" onclick="window.location.href='/study'">
        <i class="fas fa-book-open"></i>
        <span>Study Mode</span>
      </div>
      <div class="suggestion-item" onclick="window.location.href='/test'">
        <i class="fas fa-flask"></i>
        <span>Practice Test</span>
      </div>
      <div class="suggestion-item" onclick="window.location.href='/ai'">
        <i class="fas fa-robot"></i>
        <span>AI Tutor</span>
      </div>
    </div>

    <!-- Footer Links -->
    <div class="error-footer">
      <div class="divider"></div>
      <a href="/about">About</a> &middot;
      <a href="/faq">FAQ</a> &middot;
      <a href="/contact">Contact</a> &middot;
      <a href="/privacy">Privacy</a>
      <br><br>
      <span style="color:var(--text-secondary);font-size:.65rem;opacity:.5">
        &copy; 2026 OAU CBE Practice
      </span>
    </div>
  </div>
</div>

<!-- Chat FAB -->
<a href="/chat" class="chat-fab" aria-label="Chat with support"><i class="fas fa-headset"></i></a>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a href="/app" class="nav-item active"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="/exam" class="nav-item"><i class="fas fa-pen"></i><span>Exam</span></a>
    <a href="/test" class="nav-item"><i class="fas fa-flask"></i><span>Test</span></a>
    <a href="/study" class="nav-item"><i class="fas fa-book-open"></i><span>Study</span></a>
    <a href="/profile" class="nav-item"><i class="fas fa-user"></i><span>Me</span></a>
  </div>
</nav>

<script>
// ==================== THEME ====================
function initTheme(){
  const saved = localStorage.getItem('theme');
  if(saved === 'light'){
    document.body.classList.add('light-mode');
  } else {
    document.body.classList.remove('light-mode');
  }
}

// ==================== CHECK AUTH ====================
function checkAuth(){
  const token = localStorage.getItem('oau_token');
  // If logged in, update nav links
  if(token){
    // All nav links already point to correct pages
    console.log('✅ User logged in');
  }
}

// ==================== INIT ====================
document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  checkAuth();
});
</script>

</body>
</html>
