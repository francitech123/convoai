<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>OAU CBE Practice • Login / Register</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Inter',system-ui,-apple-system,sans-serif}
        :root{
            --primary:#1e3a8a;--primary-light:#3b82f6;--accent:#10b981;
            --bg:#0f172a;--bg-soft:#111c33;--card:#1e293b;--card-2:#152033;
            --border:#334155;--text:#f1f5f9;--text-secondary:#94a3b8;
            --danger:#ef4444;--success:#10b981;--shadow:0 18px 40px rgba(0,0,0,.28);
            --brand-gradient:linear-gradient(135deg,#1e3a8a,#3b82f6)
        }
        body.light-mode{
            --bg:#f4f7fb;--bg-soft:#edf3fb;--card:#ffffff;--card-2:#f8fbff;
            --border:#d7e2ef;--text:#0f172a;--text-secondary:#526173;
            --shadow:0 16px 36px rgba(15,23,42,.08)
        }
        body{background:radial-gradient(circle at top right,rgba(59,130,246,.12),transparent 25%),linear-gradient(180deg,var(--bg),#0b1324 100%);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .auth-wrap{width:100%;max-width:480px;margin:0 auto}
        .auth-card{background:var(--card);border:1px solid var(--border);border-radius:32px;padding:32px 24px;box-shadow:var(--shadow)}
        .auth-logo{text-align:center;margin-bottom:20px}
        .auth-logo svg{width:72px;height:72px;object-fit:contain}
        .auth-logo h1{font-size:1.2rem;margin-top:6px;color:var(--text)}
        .auth-logo p{color:var(--text-secondary);font-size:.82rem}
        .auth-logo .subtitle{color:var(--primary-light);font-weight:700}

        .auth-tabs{display:flex;gap:8px;margin-bottom:20px;background:var(--bg-soft);border-radius:14px;padding:4px}
        .auth-tab{flex:1;padding:12px;text-align:center;border:none;border-radius:10px;background:transparent;color:var(--text-secondary);font-weight:600;font-size:.82rem;cursor:pointer;transition:all .2s;font-family:inherit}
        .auth-tab.active{background:var(--brand-gradient);color:#fff;box-shadow:0 4px 12px rgba(59,130,246,.3)}
        .auth-tab:hover:not(.active){background:rgba(59,130,246,.1);color:var(--text)}

        .auth-panel{display:none;animation:fadeIn .3s ease}
        .auth-panel.active{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

        .form-group{margin-bottom:14px}
        .form-group label{display:block;margin-bottom:5px;font-weight:600;font-size:.75rem;color:var(--text-secondary)}
        .form-group input,.form-group select{width:100%;padding:12px 14px;background:var(--bg-soft);border:2px solid var(--border);border-radius:12px;color:var(--text);font-size:.88rem;font-family:inherit;transition:all .2s}
        .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
        .form-group input::placeholder{color:var(--text-secondary);opacity:.5}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        @media(max-width:500px){.form-row{grid-template-columns:1fr}}

        .password-wrap{position:relative}
        .password-wrap input{padding-right:48px}
        .toggle-pwd{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:.9rem}
        .toggle-pwd:hover{color:var(--text)}

        .pwd-strength{margin-top:6px;display:flex;gap:6px;align-items:center}
        .strength-bar{flex:1;height:4px;background:var(--border);border-radius:4px;overflow:hidden}
        .strength-fill{height:100%;width:0;transition:width .3s;border-radius:4px}
        .strength-text{font-size:.6rem;font-weight:600;min-width:50px}
        .strength-text.weak{color:var(--danger)}.strength-text.fair{color:#f59e0b}.strength-text.good{color:var(--primary-light)}.strength-text.strong{color:var(--success)}

        .pwd-match{margin-top:4px;font-size:.65rem;display:none;align-items:center;gap:6px}
        .pwd-match.match{color:var(--success);display:flex}
        .pwd-match.nomatch{color:var(--danger);display:flex}

        .options-row{display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px}
        .options-row label{display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:.78rem;cursor:pointer}
        .options-row input[type="checkbox"]{width:16px;height:16px;accent-color:var(--primary-light);cursor:pointer}
        .forgot-link{color:var(--primary-light);font-size:.78rem;text-decoration:none;font-weight:600}
        .forgot-link:hover{text-decoration:underline}

        .terms-row{display:flex;align-items:flex-start;gap:10px;margin:12px 0 16px}
        .terms-row input[type="checkbox"]{width:16px;height:16px;accent-color:var(--primary-light);margin-top:2px;cursor:pointer;flex-shrink:0}
        .terms-row label{color:var(--text-secondary);font-size:.75rem;line-height:1.5;cursor:pointer}
        .terms-row label a{color:var(--primary-light);text-decoration:none}
        .terms-row label a:hover{text-decoration:underline}

        .btn-auth{width:100%;padding:14px;background:var(--brand-gradient);color:#fff;border:none;border-radius:14px;font-weight:700;font-size:.95rem;cursor:pointer;transition:all .2s;font-family:inherit}
        .btn-auth:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 25px rgba(59,130,246,.35)}
        .btn-auth:disabled{opacity:.6;cursor:not-allowed}
        .btn-auth i{margin-right:8px}

        .alert{padding:10px 14px;border-radius:10px;margin-bottom:14px;display:none;font-size:.8rem;text-align:center}
        .alert-error{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.2)}
        .alert-success{background:rgba(16,185,129,.12);color:var(--success);border:1px solid rgba(16,185,129,.2)}
        .alert.show{display:block}

        .auth-footer{text-align:center;margin-top:16px}
        .auth-footer a{color:var(--text-secondary);text-decoration:none;font-size:.8rem;transition:color .2s}
        .auth-footer a:hover{color:var(--primary-light)}
        .auth-footer .switch-link{color:var(--primary-light);font-weight:600}

        @media(max-width:480px){.auth-card{padding:20px 16px}}
    </style>
</head>
<body>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">
            <!-- SVG Logo -->
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="90" fill="none" stroke="#3b82f6" stroke-width="3.5"/>
                <path id="topArc" d="M 30 100 A 70 70 0 0 1 170 100" fill="none"/>
                <text font-size="17" font-weight="900" fill="#3b82f6" letter-spacing="3">
                    <textPath href="#topArc" startOffset="50%" text-anchor="middle">OAU</textPath>
                </text>
                <path id="bottomArc" d="M 30 100 A 70 70 0 0 0 170 100" fill="none"/>
                <text font-size="7.5" font-weight="800" fill="#1e3a8a" letter-spacing="1.2">
                    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">EXAM CBT PRACTICE</textPath>
                </text>
                <circle cx="100" cy="100" r="19" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
                <line x1="81" y1="100" x2="119" y2="100" stroke="#3b82f6" stroke-width="1.5"/>
                <line x1="100" y1="81" x2="100" y2="119" stroke="#3b82f6" stroke-width="1.5"/>
                <text x="100" y="104" font-size="7.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">OAU</text>
            </svg>
            <h1>OAU <span class="subtitle">CBE</span> Practice</h1>
            <p id="authSubtitle">Sign in to continue</p>
        </div>

        <div class="alert alert-error" id="errorAlert"></div>
        <div class="alert alert-success" id="successAlert"></div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="tabLogin" onclick="switchAuth('login')">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
            <button class="auth-tab" id="tabRegister" onclick="switchAuth('register')">
                <i class="fas fa-user-plus"></i> Register
            </button>
        </div>

        <!-- ==================== LOGIN PANEL ==================== -->
        <div class="auth-panel active" id="loginPanel">
            <form onsubmit="return false">
                <div class="form-group">
                    <label id="loginLabel"><i class="fas fa-user"></i> Username </label>
                    <input type="text" id="loginInput" placeholder="Enter username " autocomplete="username">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrap">
                        <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
                        <button type="button" class="toggle-pwd" onclick="togglePassword('loginPassword','loginPwdIcon')">
                            <i class="fas fa-eye" id="loginPwdIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="options-row">
                    <label>
                        <input type="checkbox" id="rememberMe">
                        Remember Me
                    </label>
                    <a href="/forgot-password" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-auth" id="loginBtn" onclick="handleLogin()">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>
        </div>

        <!-- ==================== REGISTER PANEL ==================== -->
        <div class="auth-panel" id="registerPanel">
            <form onsubmit="return false">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="regFullName" placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Username *</label>
                        <input type="text" id="regUsername" placeholder="johndoe">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="you@example.com">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Password *</label>
                        <div class="password-wrap">
                            <input type="password" id="regPassword" placeholder="Min 8 characters" oninput="checkPasswordStrength()">
                            <button type="button" class="toggle-pwd" onclick="togglePassword('regPassword','regPwdIcon')">
                                <i class="fas fa-eye" id="regPwdIcon"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password *</label>
                        <div class="password-wrap">
                            <input type="password" id="regConfirmPassword" placeholder="Confirm password" oninput="checkPasswordMatch()">
                            <button type="button" class="toggle-pwd" onclick="togglePassword('regConfirmPassword','regConfirmIcon')">
                                <i class="fas fa-eye" id="regConfirmIcon"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="pwd-strength" id="strengthContainer" style="display:none">
                    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                    <span class="strength-text" id="strengthText">Weak</span>
                </div>
                <div class="pwd-match" id="matchContainer">
                    <span id="matchText">Passwords match</span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Faculty *</label>
                        <select id="regFaculty">
                            <option value="">Select Faculty</option>
                            <option value="Agriculture">Agriculture</option>
                            <option value="Arts">Arts</option>
                            <option value="Law">Law</option>
                            <option value="Science">Science</option>
                            <option value="Social Sciences">Social Sciences</option>
                            <option value="Education">Education</option>
                            <option value="Pharmacy">Pharmacy</option>
                            <option value="Technology">Technology</option>
                            <option value="Administration">Administration</option>
                            <option value="Computing">Computing</option>
                            <option value="General Studies">General Studies</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Department *</label>
                        <input type="text" id="regDepartment" placeholder="e.g., Chemistry">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Level *</label>
                        <select id="regLevel">
                            <option value="">Select Level</option>
                            <option value="100">100 Level</option>
                            <option value="200">200 Level</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Security Question *</label>
                        <select id="regSecurityQuestion">
                            <option value="">Select question</option>
                            <option value="What is your mother's maiden name?">Mother's maiden name?</option>
                            <option value="What is the name of your first pet?">First pet name?</option>
                            <option value="What city were you born in?">City of birth?</option>
                            <option value="What is your favorite food?">Favorite food?</option>
                            <option value="What was your first car?">First car?</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Security Answer *</label>
                    <input type="text" id="regSecurityAnswer" placeholder="Your answer">
                </div>

                <div class="terms-row">
                    <input type="checkbox" id="acceptTerms">
                    <label for="acceptTerms">
                        I accept the <a href="/terms" target="_blank">Terms of Service</a> and 
                        <a href="/privacy" target="_blank">Privacy Policy</a> *
                    </label>
                </div>

                <button type="submit" class="btn-auth" id="registerBtn" onclick="handleRegister()">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>
        </div>

        <div class="auth-footer">
            <a href="#" id="authSwitchLink" onclick="switchAuth('login')">
                Already have an account? <span class="switch-link">Login →</span>
            </a>
            <div style="margin-top:6px">
                <a href="/" style="font-size:.7rem;opacity:.5">← Back to Home</a>
            </div>
        </div>
    </div>
</div>

<script>
    // ==================== CONFIGURATION ====================
    const API_BASE = 'https://oau-exam-api.onrender.com/api';
    let currentAuth = 'login';

    // ==================== THEME ====================
    function initTheme() {
        const saved = localStorage.getItem('theme');
        if (saved === 'light') {
            document.body.classList.add('light-mode');
        }
    }
    initTheme();

    // ==================== SWITCH AUTH PANEL ====================
    function switchAuth(mode) {
        currentAuth = mode;
        document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
        document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
        document.getElementById('loginPanel').classList.toggle('active', mode === 'login');
        document.getElementById('registerPanel').classList.toggle('active', mode === 'register');

        const subtitle = document.getElementById('authSubtitle');
        const switchLink = document.getElementById('authSwitchLink');

        if (mode === 'login') {
            subtitle.textContent = 'Sign in to continue';
            switchLink.innerHTML = 'Don\'t have an account? <span class="switch-link">Register →</span>';
            switchLink.onclick = function(e){ e.preventDefault(); switchAuth('register'); };
        } else {
            subtitle.textContent = 'Create your free account';
            switchLink.innerHTML = 'Already have an account? <span class="switch-link">Login →</span>';
            switchLink.onclick = function(e){ e.preventDefault(); switchAuth('login'); };
        }

        hideAlerts();
    }

    // ==================== TOGGLE PASSWORD ====================
    function togglePassword(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fas fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fas fa-eye';
        }
    }

    // ==================== PASSWORD STRENGTH ====================
    function checkPasswordStrength() {
        const password = document.getElementById('regPassword').value;
        const container = document.getElementById('strengthContainer');
        const fill = document.getElementById('strengthFill');
        const text = document.getElementById('strengthText');

        if (password.length === 0) {
            container.style.display = 'none';
            return;
        }
        container.style.display = 'flex';

        let strength = 0;
        if (password.length >= 8) strength++;
        if (/[a-z]/.test(password)) strength++;
        if (/[A-Z]/.test(password)) strength++;
        if (/[0-9]/.test(password)) strength++;
        if (/[^a-zA-Z0-9]/.test(password)) strength++;

        let pct = 0, msg = '', cls = '';
        if (strength <= 2) { pct = 25; msg = 'Weak'; cls = 'weak'; }
        else if (strength <= 3) { pct = 50; msg = 'Fair'; cls = 'fair'; }
        else if (strength <= 4) { pct = 75; msg = 'Good'; cls = 'good'; }
        else { pct = 100; msg = 'Strong'; cls = 'strong'; }

        fill.style.width = pct + '%';
        text.textContent = msg;
        text.className = 'strength-text ' + cls;

        checkPasswordMatch();
    }

    // ==================== PASSWORD MATCH ====================
    function checkPasswordMatch() {
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirmPassword').value;
        const container = document.getElementById('matchContainer');
        const text = document.getElementById('matchText');

        if (confirm.length === 0 || password.length === 0) {
            container.className = 'pwd-match';
            container.style.display = 'none';
            return;
        }

        if (password === confirm) {
            container.className = 'pwd-match match';
            text.textContent = '✓ Passwords match';
        } else {
            container.className = 'pwd-match nomatch';
            text.textContent = '✗ Passwords do not match';
        }
        container.style.display = 'flex';
    }

    // ==================== ALERTS ====================
    function showError(msg) {
        const el = document.getElementById('errorAlert');
        el.textContent = '❌ ' + msg;
        el.classList.add('show');
        document.getElementById('successAlert').classList.remove('show');
    }

    function showSuccess(msg) {
        const el = document.getElementById('successAlert');
        el.textContent = '✅ ' + msg;
        el.classList.add('show');
        document.getElementById('errorAlert').classList.remove('show');
    }

    function hideAlerts() {
        document.getElementById('errorAlert').classList.remove('show');
        document.getElementById('successAlert').classList.remove('show');
    }

    // ==================== CHECK LOGIN STATUS ====================
    function checkAuth() {
        const token = localStorage.getItem('oau_token');
        if (token) {
            fetch(API_BASE + '/auth/me', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/app';
                } else {
                    localStorage.removeItem('oau_token');
                    localStorage.removeItem('oau_user');
                }
            })
            .catch(() => {
                localStorage.removeItem('oau_token');
                localStorage.removeItem('oau_user');
            });
        }
    }
    checkAuth();

    // ==================== HANDLE LOGIN ====================
    async function handleLogin() {
        const loginValue = document.getElementById('loginInput').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const rememberMe = document.getElementById('rememberMe').checked;

        if (!loginValue) {
            showError('Please enter your username or email');
            return;
        }
        if (!password) {
            showError('Please enter your password');
            return;
        }

        const btn = document.getElementById('loginBtn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
        btn.disabled = true;
        hideAlerts();

        try {
            // Try as email first if it contains @, otherwise as username
            const isEmail = loginValue.includes('@');
            const loginData = { password };

            if (isEmail) {
                loginData.email = loginValue;
            } else {
                loginData.username = loginValue;
            }

            console.log('📤 Login attempt:', isEmail ? 'Email: ' + loginValue : 'Username: ' + loginValue);

            const response = await fetch(API_BASE + '/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loginData)
            });

            const data = await response.json();

            if (response.ok && data.success) {
                localStorage.setItem('oau_token', data.token);
                localStorage.setItem('oau_user', JSON.stringify(data.user));

                if (rememberMe) {
                    localStorage.setItem('remembered_user', JSON.stringify({
                        username: loginValue,
                        method: isEmail ? 'email' : 'username'
                    }));
                } else {
                    localStorage.removeItem('remembered_user');
                }

                showSuccess('✅ Login successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = '/app';
                }, 500);
                return;
            }

            showError(data.error || 'Invalid credentials. Please try again.');
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            btn.disabled = false;

        } catch(e) {
            console.error('Login error:', e);
            showError('Connection error. Please check your internet and try again.');
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            btn.disabled = false;
        }
    }

    // ==================== HANDLE REGISTER ====================
    async function handleRegister() {
        const fullName = document.getElementById('regFullName').value.trim();
        const username = document.getElementById('regUsername').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const confirmPassword = document.getElementById('regConfirmPassword').value.trim();
        const faculty = document.getElementById('regFaculty').value;
        const department = document.getElementById('regDepartment').value.trim();
        const level = document.getElementById('regLevel').value;
        const securityQuestion = document.getElementById('regSecurityQuestion').value;
        const securityAnswer = document.getElementById('regSecurityAnswer').value.trim();
        const acceptTerms = document.getElementById('acceptTerms').checked;

        // Validation
        if (!fullName || !username || !password || !confirmPassword || !faculty || !department || !level || !securityQuestion || !securityAnswer) {
            showError('Please fill all required fields (*)');
            return;
        }
        if (faculty === '') { showError('Please select a faculty'); return; }
        if (level === '') { showError('Please select your level'); return; }
        if (securityQuestion === '') { showError('Please select a security question'); return; }
        if (password.length < 8) { showError('Password must be at least 8 characters'); return; }
        if (password !== confirmPassword) { showError('Passwords do not match'); return; }
        if (!acceptTerms) { showError('Please accept the Terms of Service and Privacy Policy'); return; }

        const btn = document.getElementById('registerBtn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
        btn.disabled = true;
        hideAlerts();

        try {
            const response = await fetch(API_BASE + '/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fullName, username, email, password,
                    faculty, department, level,
                    securityQuestion, securityAnswer
                })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                localStorage.setItem('oau_token', data.token);
                localStorage.setItem('oau_user', JSON.stringify(data.user));
                showSuccess('Account created! Welcome aboard!');
                setTimeout(() => {
                    window.location.href = '/app';
                }, 1000);
            } else {
                showError(data.error || 'Registration failed');
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                btn.disabled = false;
            }
        } catch(e) {
            console.error('Register error:', e);
            showError('Connection error. Please try again.');
            btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            btn.disabled = false;
        }
    }

    // ==================== KEYBOARD SHORTCUTS ====================
    document.getElementById('loginPassword').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleLogin();
    });

    document.getElementById('loginInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('loginPassword').focus();
        }
    });

    document.getElementById('regConfirmPassword').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleRegister();
    });

    // ==================== CHECK REMEMBERED USER ====================
    function checkRememberedUser() {
        try {
            const remembered = localStorage.getItem('remembered_user');
            if (remembered) {
                const data = JSON.parse(remembered);
                document.getElementById('loginInput').value = data.username || '';
                document.getElementById('rememberMe').checked = true;
            }
        } catch(e) {}
    }
    checkRememberedUser();

    // ==================== EXPOSE GLOBALLY ====================
    window.switchAuth = switchAuth;
    window.togglePassword = togglePassword;
    window.handleLogin = handleLogin;
    window.handleRegister = handleRegister;
    window.checkPasswordStrength = checkPasswordStrength;
    window.checkPasswordMatch = checkPasswordMatch;
</script>
</body>
</html>
