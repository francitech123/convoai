<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>FAQ • OAU Exam CBT Practice</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',sans-serif}
        
        :root{
            --primary:#1e3a8a;
            --primary-light:#3b82f6;
            --accent:#10b981;
            --warning:#f59e0b;
            --danger:#ef4444;
            --bg:#0f172a;
            --card:#1e293b;
            --border:#334155;
            --text:#f1f5f9;
            --text-secondary:#94a3b8;
            --card-hover:#2d3a5e;
            --brand-gradient:linear-gradient(135deg,#1e3a8a,#3b82f6);
        }
        
        body.light-mode{
            --bg:#f8fafc;
            --card:#ffffff;
            --border:#e2e8f0;
            --text:#0f172a;
            --text-secondary:#475569;
            --card-hover:#f1f5f9;
        }
        
        body{background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s ease}
        
        /* Animations */
        .edu-animation{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
        .float-book{position:absolute;font-size:clamp(2rem,5vw,4rem);opacity:0.03;animation:floatSlow 20s ease-in-out infinite}
        .float-pen{position:absolute;font-size:clamp(1.5rem,4vw,3rem);opacity:0.03;animation:floatMedium 15s ease-in-out infinite}
        .float-grad{position:absolute;font-size:clamp(2rem,5vw,4rem);opacity:0.03;animation:floatFast 12s ease-in-out infinite}
        @keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-30px) rotate(5deg)}100%{transform:translateY(0) rotate(0deg)}}
        @keyframes floatMedium{0%{transform:translateX(0) translateY(0) rotate(0deg)}50%{transform:translateX(20px) translateY(-20px) rotate(10deg)}100%{transform:translateX(0) translateY(0) rotate(0deg)}}
        @keyframes floatFast{0%{transform:translateY(0) rotate(0deg) scale(1)}50%{transform:translateY(-15px) rotate(-5deg) scale(1.05)}100%{transform:translateY(0) rotate(0deg) scale(1)}}
        
        .water-drip{position:fixed;top:0;left:50%;width:3px;height:15px;background:linear-gradient(180deg,rgba(59,130,246,0.4),rgba(59,130,246,0));border-radius:50%;animation:drip 3s ease-in infinite;pointer-events:none;z-index:1}
        @keyframes drip{0%{top:-20px;opacity:0.5}80%{top:100vh;opacity:0.2}100%{top:100vh;opacity:0}}
        
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        @keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
        
        /* Header */
        .header{background:rgba(15,23,42,.98);backdrop-filter:blur(12px);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
        body.light-mode .header{background:rgba(255,255,255,.98)}
        .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.1rem;color:var(--text);text-decoration:none}
        .logo-icon{font-size:1.2rem}
        .logo-text{background:linear-gradient(135deg,#ffffff,#a5f3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
        body.light-mode .logo-text{background:linear-gradient(135deg,var(--primary),var(--primary-light));-webkit-background-clip:text;background-clip:text;color:transparent}
        .header-actions{display:flex;align-items:center;gap:12px}
        .theme-toggle{background:rgba(59,130,246,0.15);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
        .theme-toggle:hover{background:var(--primary-light);color:#fff}
        .back-link{color:var(--text-secondary);text-decoration:none;display:flex;align-items:center;gap:6px;font-size:.9rem}
        .back-link:hover{color:var(--text)}
        
        .container{max-width:1000px;margin:0 auto;padding:20px;position:relative;z-index:2;padding-bottom:80px}
        
        .page-header{text-align:center;margin-bottom:40px;animation:fadeIn .5s ease}
        .page-header h1{font-size:clamp(1.5rem,5vw,2rem);display:flex;align-items:center;justify-content:center;gap:12px}
        .page-header h1 i{color:var(--primary-light)}
        .page-header p{color:var(--text-secondary);margin-top:8px}
        
        .search-box{max-width:500px;margin:0 auto 30px}
        .search-box input{width:100%;padding:14px 20px;background:var(--card);border:2px solid var(--border);border-radius:50px;color:var(--text);font-size:1rem;outline:none;transition:all .2s}
        .search-box input:focus{border-color:var(--primary-light)}
        .search-box input::placeholder{color:var(--text-secondary)}
        
        .category-tabs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:30px}
        .category-tab{background:var(--card);border:1px solid var(--border);padding:8px 20px;border-radius:30px;cursor:pointer;font-size:.85rem;transition:all .2s;color:var(--text-secondary)}
        .category-tab:hover{background:rgba(59,130,246,.1);border-color:var(--primary-light)}
        .category-tab.active{background:var(--primary-light);color:#fff;border-color:var(--primary-light)}
        
        .faq-grid{display:grid;gap:16px}
        .faq-item{background:var(--card);border-radius:16px;border:1px solid var(--border);overflow:hidden;transition:all .2s;animation:fadeIn .3s ease}
        .faq-item:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.2)}
        .faq-question{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:600;color:var(--text);transition:all .2s}
        .faq-question:hover{background:rgba(59,130,246,.05)}
        .faq-question i{color:var(--primary-light);transition:transform .2s}
        .faq-question.open i{transform:rotate(180deg)}
        .faq-answer{padding:0 20px;max-height:0;overflow:hidden;transition:max-height .3s ease;border-top:1px solid transparent}
        .faq-answer.show{max-height:300px;padding:0 20px 18px;border-top-color:var(--border)}
        .faq-answer p{color:var(--text-secondary);line-height:1.6;font-size:.9rem}
        .faq-answer a{color:var(--primary-light);text-decoration:none}
        .faq-answer a:hover{text-decoration:underline}
        
        .no-results{text-align:center;padding:60px;color:var(--text-secondary);font-size:1rem}
        .no-results i{font-size:3rem;margin-bottom:16px;opacity:.5}
        
        .footer-links{display:flex;justify-content:center;gap:20px;padding:20px 0;flex-wrap:wrap;border-top:1px solid var(--border);margin-top:40px}
        .footer-links a{color:var(--text-secondary);text-decoration:none;font-size:.78rem}
        .footer-links a:hover{color:var(--primary-light)}
        .copyright{text-align:center;color:var(--text-secondary);font-size:.7rem;padding-bottom:12px}
        
        .bottom-nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.98);backdrop-filter:blur(12px);padding:10px 24px;border-radius:50px;display:flex;gap:12px;z-index:98;border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 32px rgba(0,0,0,.3)}
        body.light-mode .bottom-nav{background:rgba(255,255,255,.98);border:1px solid rgba(0,0,0,.1)}
        .nav-item{display:flex;flex-direction:column;align-items:center;padding:8px 16px;border-radius:40px;color:var(--text-secondary);text-decoration:none;font-size:.7rem;transition:all .3s ease;gap:4px}
        .nav-item i{font-size:1.2rem;margin-bottom:2px;transition:transform .2s}
        .nav-item:hover:not(.active){background:rgba(59,130,246,.15);color:var(--primary-light);transform:translateY(-2px)}
        .nav-item:hover:not(.active) i{transform:scale(1.1)}
        .nav-item.active{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;box-shadow:0 4px 12px rgba(59,130,246,.4)}
        
        .chat-fab{position:fixed;bottom:100px;right:20px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:99;box-shadow:0 4px 15px rgba(16,185,129,.4);font-size:1.3rem;text-decoration:none;transition:all .2s}
        .chat-fab:hover{transform:scale(1.1);background:#059669}
        
        @media(max-width:768px){
            .container{padding:16px}
            .faq-question{font-size:.9rem;padding:14px 16px}
            .category-tab{padding:6px 14px;font-size:.75rem}
            .bottom-nav{gap:4px;padding:8px 16px}
            .nav-item{padding:4px 10px}
        }
    </style>
</head>
<body>

<div class="edu-animation">
    <div class="float-book" style="top:5%;left:3%"><i class="fas fa-question-circle"></i></div>
    <div class="float-book" style="bottom:15%;right:5%;animation-delay:2s"><i class="fas fa-life-ring"></i></div>
    <div class="float-pen" style="top:20%;right:10%;animation-delay:1s"><i class="fas fa-message"></i></div>
    <div class="float-pen" style="bottom:30%;left:8%;animation-delay:3s"><i class="fas fa-question"></i></div>
    <div class="float-grad" style="top:60%;left:15%;animation-delay:0.5s"><i class="fas fa-crown"></i></div>
    <div class="float-grad" style="top:10%;right:20%;animation-delay:2.5s"><i class="fas fa-star"></i></div>
</div>

<div class="water-drip"></div>
<div class="water-drip" style="left:30%;animation-delay:1.5s"></div>
<div class="water-drip" style="left:70%;animation-delay:2.5s"></div>

<header class="header">
    <a href="/app" class="logo"><span class="logo-icon">🎓</span><span class="logo-text">OAU Exam CBT Practice</span></a>
    <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" onclick="toggleThemeMode()"><i class="fas fa-moon"></i></button>
        <a href="/app" class="back-link"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </div>
</header>

<div class="container">
    <div class="page-header">
        <h1><i class="fas fa-question-circle"></i> Frequently Asked Questions</h1>
        <p>Find answers to common questions about OAU Exam CBT Practice</p>
    </div>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Search FAQ... (e.g., payment, exam, premium)">
    </div>
    
    <div class="category-tabs" id="categoryTabs">
        <button class="category-tab active" data-cat="all">📋 All</button>
        <button class="category-tab" data-cat="payment">💰 Payment & Premium</button>
        <button class="category-tab" data-cat="exam">📝 Exam Mode</button>
        <button class="category-tab" data-cat="test">🧪 Test Mode</button>
        <button class="category-tab" data-cat="account">👤 Account</button>
        <button class="category-tab" data-cat="technical">⚙️ Technical</button>
        <button class="category-tab" data-cat="general">💬 General</button>
    </div>
    
    <div class="faq-grid" id="faqGrid"></div>
    
    <div class="footer-links">
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
        <a href="/about">About</a>
        <a href="/developer">Developer</a>
        <a href="/chat">💬 Live Chat</a>
        <a href="/contact">📧 Contact</a>
    </div>
    <p class="copyright">&copy; 2026 OAU Exam CBT Practice by FrancisTech</p>
</div>

<a href="/chat" class="chat-fab"><i class="fas fa-headset"></i></a>

<nav class="bottom-nav">
    <a href="/app" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="/exam" class="nav-item"><i class="fas fa-pen"></i><span>Exam</span></a>
    <a href="/test" class="nav-item"><i class="fas fa-flask"></i><span>Test</span></a>
    <a href="/ai" class="nav-item"><i class="fas fa-robot"></i><span>AI</span></a>
    <a href="/profile" class="nav-item"><i class="fas fa-user"></i><span>Me</span></a>
</nav>

<script>
    const faqData = [
        // Payment & Premium
        { category: "payment", question: "How do I upgrade to Premium?", answer: "To upgrade to Premium:\n\n1. Go to the Payment page from your Dashboard\n2. Choose your plan:\n   • Semester Plan: ₦2,000 (6 months)\n   • Session Plan: ₦3,500 (12 months)\n3. Select your payment method (Bank Transfer or Card)\n4. Complete the payment\n5. Your account will be upgraded automatically within 5 minutes!\n\nContact support if you don't see the upgrade after 10 minutes." },
        { category: "payment", question: "What's the difference between Free and Premium?", answer: "🎓 FREE Plan:\n• 10 free courses (CHM 102, MTH 102, GST 111, etc.)\n• Basic features\n• Limited access\n\n💎 PREMIUM Plan (₦2,000/semester or ₦3,500/session):\n• ALL 72+ courses across 15 faculties\n• Unlimited Exam Mode access\n• AI Assistant with file analysis\n• Advanced performance analytics\n• Priority support\n• Study streak tracking\n• Leaderboard rankings" },
        { category: "payment", question: "What payment methods are accepted?", answer: "We accept:\n• 💳 Card Payments (Visa, Mastercard, Verve)\n• 🏦 Bank Transfer\n• 📱 USSD Banking\n• 💰 Cash on Campus (contact support)\n\nAll payments are securely processed. Contact support for assistance with any payment method." },
        { category: "payment", question: "Is there a refund policy?", answer: "We offer a 7-day money-back guarantee if you're not satisfied with Premium features. Contact support within 7 days of purchase for a full refund.\n\nAfter 7 days, refunds are handled on a case-by-case basis." },
        
        // Exam Mode
        { category: "exam", question: "How does Exam Mode work?", answer: "Exam Mode simulates a real CBT exam:\n• ⏱️ Timed: You have a set time limit\n• ❌ No hints available\n• 🚫 Anti-cheat: Tab switching triggers warnings\n• 📊 Instant results after submission\n• 🏆 Scores affect your leaderboard rank\n\nPerfect for final exam preparation!" },
        { category: "exam", question: "What happens if I switch tabs during an exam?", answer: "⚠️ First tab switch: Warning message\n⚠️ Second tab switch: Exam auto-submits\n\nThis prevents cheating and ensures fair assessment. Always stay on the exam tab until completion!" },
        { category: "exam", question: "Can I pause an exam?", answer: "No, exams cannot be paused once started. The timer continues running even if you close the browser. Make sure you have uninterrupted time before starting an exam." },
        { category: "exam", question: "What happens if I lose internet during an exam?", answer: "If your internet disconnects:\n1. The timer continues counting\n2. Your answers are saved locally\n3. Try to reconnect quickly\n4. If reconnection fails, the exam will auto-submit with your current answers\n\nWe recommend a stable internet connection before starting." },
        
        // Test Mode
        { category: "test", question: "How is Test Mode different from Exam Mode?", answer: "Test Mode is for learning:\n• 💡 Hints available for each question\n• ⏱️ Still timed, but more relaxed\n• ✅ No leaderboard impact\n• 📚 Great for practice and learning\n• 🧪 Includes explanations for answers\n\nUse Test Mode to master topics before attempting Exam Mode!" },
        { category: "test", question: "Can I use hints during a test?", answer: "Yes! Test Mode includes a 'Show Hint' button for each question. Hints provide guidance without giving away the full answer - perfect for learning!" },
        
        // Account
        { category: "account", question: "How do I change my profile information?", answer: "Go to Profile page → Edit Profile\n\nYou can update:\n• Full Name\n• Email address\n• Faculty & Department\n• Level (100-600)\n• Profile picture\n\nSave changes and they'll be updated immediately." },
        { category: "account", question: "How do I reset my password?", answer: "1. Go to Login page\n2. Click 'Forgot Password'\n3. Enter your registered email\n4. Check your email for reset link\n5. Follow the link to create a new password\n\nContact support if you don't receive the email." },
        { category: "account", question: "Can I delete my account?", answer: "Yes, go to Profile → Danger Zone → Delete My Account\n\n⚠️ WARNING: This action is permanent! All your data including exam history, scores, and progress will be lost forever." },
        
        // Technical
        { category: "technical", question: "The page isn't loading properly. What should I do?", answer: "Try these fixes:\n1. 🔄 Refresh the page\n2. 🗑️ Clear your browser cache\n3. 🌐 Check your internet connection\n4. 🔄 Try a different browser (Chrome recommended)\n5. 📱 Try on a different device\n\nIf the issue persists, contact support via Live Chat or email." },
        { category: "technical", question: "What browsers are supported?", answer: "We support all modern browsers:\n• ✅ Google Chrome (recommended)\n• ✅ Mozilla Firefox\n• ✅ Microsoft Edge\n• ✅ Safari (Mac)\n• ✅ Opera\n\n⚠️ Internet Explorer is NOT supported." },
        { category: "technical", question: "Why is the leaderboard not updating?", answer: "Leaderboard updates every 30 seconds automatically. If you don't see your score:\n1. Complete an exam in Exam Mode (tests don't count for leaderboard)\n2. Wait up to 30 seconds\n3. Click the 'Refresh' button\n4. Check your average score in Profile\n\nYour rank depends on your average score across all exams." },
        
        // General
        { category: "general", question: "What free courses are available?", answer: "Free courses (10 total):\n• CHM 102\n• MTH 102\n• GET 102\n• GST 111\n• GST 112\n• ACC 102\n• AGR 102\n• ENG 102\n• EDU 102\n• ECO 102\n\nUpgrade to Premium for ALL 72+ courses across all faculties!" },
        { category: "general", question: "How does the study streak work?", answer: "Your study streak tracks consecutive days you've taken an exam or test. Each day you complete at least one exam or test, your streak increases. Miss a day and it resets to 0!\n\n📅 Longest Streak tracks your best performance ever.\n🔥 Keep the streak going daily!" },
        { category: "general", question: "What are achievements and how do I earn them?", answer: "Achievements are badges you earn for milestones:\n🏆 First Exam Completed\n🔥 7-Day Streak\n⭐ Perfect Score (100%)\n📚 Course Master (10 exams in one course)\n🎓 Faculty Champion\n👑 Top 10 Leaderboard\n\nKeep practicing to unlock all achievements!" },
        { category: "general", question: "How do I contact support?", answer: "You can reach us through:\n• 💬 Live Chat (fastest response)\n• 📧 Email: francistech123@gmail.com\n• 📱 WhatsApp Channel (link in Contact page)\n• 💬 Telegram Group (link in Contact page)\n\nWe typically respond within 2-4 hours on weekdays." },
        { category: "general", question: "Who built this platform?", answer: "OAU Exam CBT Practice was built by FrancisTech (francistech123@gmail.com) - a passionate developer dedicated to helping OAU students excel in their exams through technology." }
    ];
    
    let currentCategory = "all";
    let searchTerm = "";
    
    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            const toggleBtn = document.getElementById('themeToggleBtn');
            if (toggleBtn) toggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
        } else {
            document.body.classList.remove('light-mode');
            const toggleBtn = document.getElementById('themeToggleBtn');
            if (toggleBtn) toggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
        }
    }
    
    function toggleThemeMode() {
        if (document.body.classList.contains('light-mode')) {
            document.body.classList.remove('light-mode');
            localStorage.setItem('theme', 'dark');
            document.getElementById('themeToggleBtn').innerHTML = '<i class="fas fa-moon"></i>';
        } else {
            document.body.classList.add('light-mode');
            localStorage.setItem('theme', 'light');
            document.getElementById('themeToggleBtn').innerHTML = '<i class="fas fa-sun"></i>';
        }
    }
    window.toggleThemeMode = toggleThemeMode;
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function formatAnswer(text) {
        return text.replace(/\n/g, '<br>').replace(/•/g, '•');
    }
    
    function renderFAQs() {
        const grid = document.getElementById('faqGrid');
        let filtered = [...faqData];
        
        if (currentCategory !== "all") {
            filtered = filtered.filter(f => f.category === currentCategory);
        }
        
        if (searchTerm) {
            const term = searchTerm.toLowerCase();
            filtered = filtered.filter(f => 
                f.question.toLowerCase().includes(term) || 
                f.answer.toLowerCase().includes(term)
            );
        }
        
        if (filtered.length === 0) {
            grid.innerHTML = `<div class="no-results"><i class="fas fa-search"></i><p>No matching questions found.</p><p style="font-size:.8rem">Try a different search term or category</p></div>`;
            return;
        }
        
        grid.innerHTML = filtered.map((faq, index) => `
            <div class="faq-item" data-category="${faq.category}">
                <div class="faq-question" onclick="toggleAnswer(this)">
                    <span>${escapeHtml(faq.question)}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="faq-answer">
                    <p>${formatAnswer(escapeHtml(faq.answer))}</p>
                </div>
            </div>
        `).join('');
    }
    
    window.toggleAnswer = function(element) {
        const answer = element.nextElementSibling;
        const icon = element.querySelector('i');
        
        if (answer.classList.contains('show')) {
            answer.classList.remove('show');
            element.classList.remove('open');
        } else {
            // Close all other answers
            document.querySelectorAll('.faq-answer').forEach(a => a.classList.remove('show'));
            document.querySelectorAll('.faq-question').forEach(q => q.classList.remove('open'));
            
            answer.classList.add('show');
            element.classList.add('open');
        }
    };
    
    function setCategory(category) {
        currentCategory = category;
        document.querySelectorAll('.category-tab').forEach(tab => {
            if (tab.dataset.cat === category) {
                tab.classList.add('active');
            } else {
                tab.classList.remove('active');
            }
        });
        renderFAQs();
    }
    
    // Event listeners
    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchTerm = e.target.value;
        renderFAQs();
    });
    
    document.querySelectorAll('.category-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            setCategory(tab.dataset.cat);
        });
    });
    
    // Initialize
    initTheme();
    renderFAQs();
</script>
</body>
</html>
