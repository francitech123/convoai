<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>Verify Device • OAU CBE Practice</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Inter',system-ui,-apple-system,sans-serif}
    :root{
      --primary:#1e3a8a;--primary-light:#3b82f6;--accent:#10b981;
      --bg:#0f172a;--bg-soft:#111c33;--card:#1e293b;--card-2:#152033;
      --border:#334155;--text:#f1f5f9;--text-secondary:#94a3b8;
      --danger:#ef4444;--success:#10b981;--warning:#f59e0b;
      --shadow:0 18px 40px rgba(0,0,0,.28);--brand-gradient:linear-gradient(135deg,#1e3a8a,#3b82f6)
    }
    body.light-mode{
      --bg:#f4f7fb;--bg-soft:#edf3fb;--card:#ffffff;--card-2:#f8fbff;
      --border:#d7e2ef;--text:#0f172a;--text-secondary:#526173;
      --shadow:0 16px 36px rgba(15,23,42,.08)
    }
    body{background:radial-gradient(circle at top right,rgba(59,130,246,.12),transparent 25%),linear-gradient(180deg,var(--bg),#0b1324 100%);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .auth-wrap{width:100%;max-width:440px;margin:0 auto}
    .auth-card{background:var(--card);border:1px solid var(--border);border-radius:32px;padding:36px 28px;box-shadow:var(--shadow);text-align:center}
    .auth-logo{text-align:center;margin-bottom:20px}
    .auth-logo img{width:72px;height:72px;object-fit:contain}
    .auth-logo h1{font-size:1.3rem;margin-top:8px;color:var(--text)}
    .auth-logo p{color:var(--text-secondary);font-size:.85rem}
    .auth-logo .subtitle{color:var(--primary-light);font-weight:700}
    
    .icon-big{font-size:3rem;color:var(--primary-light);margin-bottom:12px;display:block}
    .verify-title{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:6px}
    .verify-desc{color:var(--text-secondary);font-size:.85rem;margin-bottom:20px;line-height:1.5}
    
    .code-inputs{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
    .code-inputs input{width:50px;height:60px;background:var(--bg-soft);border:2px solid var(--border);border-radius:14px;color:var(--text);font-size:1.5rem;text-align:center;font-weight:700;transition:all .2s;font-family:inherit}
    .code-inputs input:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
    .code-inputs input.filled{border-color:var(--success)}
    .code-inputs input.shake{animation:shake .4s ease}
    
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
    
    .info-box{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:12px;padding:12px 16px;margin:12px 0 20px;font-size:.78rem;color:var(--text-secondary);display:flex;align-items:center;gap:8px;text-align:left}
    .info-box i{color:var(--primary-light);font-size:1rem;flex-shrink:0}
    
    .btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:700;font-size:.95rem;cursor:pointer;transition:all .2s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-primary{background:var(--brand-gradient);color:#fff}
    .btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 25px rgba(59,130,246,.35)}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed}
    .btn-secondary{background:var(--border);color:var(--text)}
    .btn-secondary:hover:not(:disabled){background:var(--card-2);transform:translateY(-2px)}
    .btn-secondary:disabled{opacity:.6;cursor:not-allowed}
    
    .alert{padding:10px 14px;border-radius:10px;margin-bottom:14px;display:none;font-size:.8rem;text-align:center}
    .alert-error{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.2)}
    .alert-success{background:rgba(16,185,129,.12);color:var(--success);border:1px solid rgba(16,185,129,.2)}
    .alert.show{display:block}
    
    .links{text-align:center;margin-top:16px}
    .links a{color:var(--text-secondary);text-decoration:none;font-size:.8rem;transition:color .2s}
    .links a:hover{color:var(--primary-light)}
    
    @media(max-width:480px){.auth-card{padding:24px 16px}.code-inputs{gap:6px}.code-inputs input{width:42px;height:50px;font-size:1.2rem}}
  </style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card" id="verifyCard">
    <div class="auth-logo">
      <img src="/logo.svg" alt="OAU CBE Practice">
      <h1>OAU <span class="subtitle">CBE</span> Practice</h1>
      <p>Verify your device</p>
    </div>

    <span class="icon-big"><i class="fas fa-shield-alt"></i></span>
    <div class="verify-title">Enter Verification Code</div>
    <p class="verify-desc">A <strong>6-digit code</strong> has been sent to your other logged-in device. Check your notifications there.</p>

    <div class="alert alert-error" id="errorAlert"></div>
    <div class="alert alert-success" id="successAlert"></div>

    <div class="info-box">
      <i class="fas fa-info-circle"></i>
      <span>Check your <strong>Notifications 🔔</strong> on the device where you're already logged in. The code expires in 10 minutes.</span>
    </div>

    <div class="code-inputs" id="codeInputs">
      <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="handleCodeInput(event, 0)" onkeydown="handleKeyDown(event, 0)" id="code0" autofocus>
      <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="handleCodeInput(event, 1)" onkeydown="handleKeyDown(event, 1)" id="code1">
      <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="handleCodeInput(event, 2)" onkeydown="handleKeyDown(event, 2)" id="code2">
      <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="handleCodeInput(event, 3)" onkeydown="handleKeyDown(event, 3)" id="code3">
      <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="handleCodeInput(event, 4)" onkeydown="handleKeyDown(event, 4)" id="code4">
      <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" oninput="handleCodeInput(event, 5)" onkeydown="handleKeyDown(event, 5)" id="code5">
    </div>

    <button class="btn btn-primary" id="verifyBtn" onclick="verifyCode()">
      <i class="fas fa-check-circle"></i> Verify & Login
    </button>

    <button class="btn btn-secondary" id="resendBtn" onclick="resendCode()" style="margin-top:10px">
      <i class="fas fa-redo"></i> Resend Code
    </button>

    <div class="links">
      <a href="/login">← Back to Login</a>
    </div>
  </div>
</div>

<script>
const API = window.CONFIG?.API_URL || (location.hostname.includes('localhost') ? 'http://localhost:5000/api' : '/api');
const qs = id => document.getElementById(id);

// ==================== GET URL PARAMETERS ====================
const urlParams = new URLSearchParams(window.location.search);
const username = urlParams.get('username') || localStorage.getItem('pendingUsername');
const pendingToken = urlParams.get('token') || localStorage.getItem('pendingSessionToken');

// ==================== CHECK IF VALID ====================
if(!username || !pendingToken){
  document.getElementById('verifyCard').innerHTML = `
    <div class="auth-logo">
      <img src="/logo.svg" alt="OAU CBE Practice">
      <h1>OAU <span class="subtitle">CBE</span> Practice</h1>
      <p>Invalid Access</p>
    </div>
    <span class="icon-big" style="color:var(--danger)"><i class="fas fa-exclamation-triangle"></i></span>
    <div class="verify-title">Session Expired</div>
    <p class="verify-desc" style="color:var(--danger)">Missing verification details. Please login again to receive a new verification code.</p>
    <a href="/login" class="btn btn-primary" style="text-decoration:none"><i class="fas fa-arrow-left"></i> Go to Login</a>
  `;
} else {
  // Auto-focus first input
  setTimeout(() => qs('code0')?.focus(), 500);
  // Cleanup
  localStorage.removeItem('pendingUsername');
  localStorage.removeItem('pendingSessionToken');
}

// ==================== HANDLE CODE INPUT ====================
function handleCodeInput(event, index){
  const input = event.target;
  const value = input.value.replace(/[^0-9]/g, '');
  input.value = value.slice(0, 1);
  
  if(value && index < 5){
    qs('code' + (index + 1))?.focus();
  }
  
  if(value){
    input.classList.add('filled');
  } else {
    input.classList.remove('filled');
  }
  
  // Auto-submit when all 6 digits entered
  const allFilled = Array.from({length: 6}, (_, i) => qs('code' + i)?.value).every(v => v);
  if(allFilled){
    verifyCode();
  }
}
window.handleCodeInput = handleCodeInput;

// ==================== HANDLE KEYDOWN ====================
function handleKeyDown(event, index){
  if(event.key === 'Backspace' && !event.target.value && index > 0){
    qs('code' + (index - 1))?.focus();
  }
  if(event.key === 'ArrowLeft' && index > 0){
    qs('code' + (index - 1))?.focus();
  }
  if(event.key === 'ArrowRight' && index < 5){
    qs('code' + (index + 1))?.focus();
  }
}
window.handleKeyDown = handleKeyDown;

// ==================== GET CODE ====================
function getCode(){
  return Array.from({length: 6}, (_, i) => qs('code' + i)?.value || '').join('');
}

// ==================== SHAKE INPUTS ====================
function shakeInputs(){
  const container = qs('codeInputs');
  container.classList.add('shake');
  setTimeout(() => container.classList.remove('shake'), 400);
}

// ==================== CLEAR INPUTS ====================
function clearInputs(){
  Array.from({length: 6}, (_, i) => {
    const input = qs('code' + i);
    if(input){ input.value = ''; input.classList.remove('filled'); }
  });
  qs('code0')?.focus();
}

// ==================== SHOW ALERTS ====================
function showError(msg){
  const el = qs('errorAlert');
  el.textContent = '❌ ' + msg;
  el.classList.add('show');
  qs('successAlert').classList.remove('show');
}

function showSuccess(msg){
  const el = qs('successAlert');
  el.textContent = '✅ ' + msg;
  el.classList.add('show');
  qs('errorAlert').classList.remove('show');
}

function hideAlerts(){
  qs('errorAlert').classList.remove('show');
  qs('successAlert').classList.remove('show');
}

// ==================== VERIFY CODE ====================
async function verifyCode(){
  if(!username || !pendingToken){
    showError('Session expired. Please login again.');
    return;
  }
  
  const code = getCode();
  if(code.length !== 6){
    showError('Please enter all 6 digits');
    shakeInputs();
    return;
  }

  const btn = qs('verifyBtn');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
  btn.disabled = true;
  hideAlerts();

  try {
    const response = await fetch(API + '/auth/verify-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: username,
        verificationCode: code,
        pendingSessionToken: pendingToken
      })
    });
    
    const data = await response.json();

    if(response.ok && data.success){
      // Store token and user data
      api.setToken(data.token);
      if(data.user){
        localStorage.setItem('oau_user', JSON.stringify(data.user));
      }
      
      showSuccess('Device verified! Redirecting...');
      setTimeout(() => {
        window.location.href = '/app';
      }, 800);
    } else {
      showError(data.error || 'Invalid verification code');
      shakeInputs();
      clearInputs();
    }
  } catch(e){
    showError('Connection error. Please try again.');
    shakeInputs();
  }

  btn.innerHTML = '<i class="fas fa-check-circle"></i> Verify & Login';
  btn.disabled = false;
}
window.verifyCode = verifyCode;

// ==================== RESEND CODE ====================
async function resendCode(){
  if(!username){
    showError('Session expired. Please login again.');
    return;
  }
  
  const btn = qs('resendBtn');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
  btn.disabled = true;

  try {
    const response = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: username,
        password: 'resend-trigger',
        resendVerification: true
      })
    });
    
    const data = await response.json();

    if(response.ok && data.success){
      showSuccess('📱 New code sent! Check your notifications.');
      clearInputs();
    } else {
      showError(data.error || 'Failed to resend code');
    }
  } catch(e){
    showError('Connection error. Please try again.');
  }

  btn.innerHTML = '<i class="fas fa-redo"></i> Resend Code';
  btn.disabled = false;
}
window.resendCode = resendCode;

// ==================== PASTE SUPPORT ====================
document.addEventListener('paste', function(e){
  if(!username || !pendingToken) return;
  
  const pasted = (e.clipboardData || window.clipboardData).getData('text');
  const digits = pasted.replace(/[^0-9]/g, '').slice(0, 6);
  
  if(digits.length === 6){
    digits.split('').forEach((digit, i) => {
      const input = qs('code' + i);
      if(input){ input.value = digit; input.classList.add('filled'); }
    });
    setTimeout(verifyCode, 300);
  }
});

// ==================== INIT THEME ====================
document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('theme');
  if(saved === 'light'){ document.body.classList.add('light-mode'); }
});
</script>
</body>
</html>
