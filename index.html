<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>OAU CBE Practice</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Inter',system-ui,-apple-system,sans-serif}
        :root{
            --primary:#1e3a8a;--primary-light:#3b82f6;--accent:#10b981;
            --bg:#0f172a;--bg-soft:#111c33;--card:#1e293b;--card-2:#152033;
            --border:#334155;--text:#f1f5f9;--text-secondary:#94a3b8;
            --shadow:0 18px 40px rgba(0,0,0,.28);--brand-gradient:linear-gradient(135deg,#1e3a8a,#3b82f6)
        }
        body.light-mode{
            --bg:#f4f7fb;--bg-soft:#edf3fb;--card:#ffffff;--card-2:#f8fbff;
            --border:#d7e2ef;--text:#0f172a;--text-secondary:#526173;
            --shadow:0 16px 36px rgba(15,23,42,.08)
        }
        body{background:radial-gradient(circle at top right,rgba(59,130,246,.12),transparent 25%),linear-gradient(180deg,var(--bg),#0b1324 100%);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        
        .entry-wrap{width:100%;max-width:480px;margin:0 auto}
        .entry-card{background:var(--card);border:1px solid var(--border);border-radius:32px;padding:40px 32px;text-align:center;box-shadow:var(--shadow);animation:fadeIn .5s ease}
        .entry-logo{margin-bottom:20px}
        .entry-logo img{width:80px;height:80px;object-fit:contain}
        .entry-logo h1{font-size:1.4rem;margin-top:8px;color:var(--text)}
        .entry-logo .subtitle{color:var(--primary-light);font-weight:700}
        .entry-logo .tagline{color:var(--text-secondary);font-size:.85rem;margin-top:4px}
        
        .entry-loader{margin:24px 0}
        .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary-light);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
        .entry-loader p{color:var(--text-secondary);font-size:.8rem;margin-top:12px}
        
        .entry-buttons{display:flex;flex-direction:column;gap:10px;margin-top:20px}
        .btn{border:none;border-radius:14px;padding:14px;font-weight:700;font-size:.9rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-family:inherit;width:100%}
        .btn-primary{background:var(--brand-gradient);color:#fff}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(59,130,246,.35)}
        .btn-soft{background:var(--border);color:var(--text)}
        .btn-soft:hover{background:var(--card-2);transform:translateY(-2px)}
        
        .entry-footer{margin-top:20px;text-align:center}
        .entry-footer a{color:var(--text-secondary);text-decoration:none;font-size:.75rem;transition:color .2s}
        .entry-footer a:hover{color:var(--primary-light)}
        .entry-footer .divider{width:40px;height:1px;background:var(--border);margin:12px auto}
        
        @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        
        @media(max-width:480px){.entry-card{padding:28px 20px}.entry-logo img{width:64px;height:64px}}
    </style>
</head>
<body>

<div class="entry-wrap">
    <div class="entry-card">
        <!-- Logo -->
        <div class="entry-logo">
            <img src="/logo.svg" alt="OAU CBE Practice">
            <h1>OAU <span class="subtitle">CBE</span> Practice</h1>
            <p class="tagline">Computer Based Exam Practice Platform</p>
        </div>

        <!-- Loading / Redirecting -->
        <div class="entry-loader">
            <div class="spinner"></div>
            <p>🔄 Checking your session...</p>
        </div>

        <!-- Action Buttons -->
        <div class="entry-buttons">
            <a href="/app" class="btn btn-primary">
                <i class="fas fa-arrow-right"></i> Go to Dashboard
            </a>
            <a href="/login" class="btn btn-soft">
                <i class="fas fa-sign-in-alt"></i> Login
            </a>
            <a href="/register" class="btn btn-soft">
                <i class="fas fa-user-plus"></i> Create Account
            </a>
        </div>

        <!-- Footer Links -->
        <div class="entry-footer">
            <div class="divider"></div>
            <a href="/about">About</a> &middot;
            <a href="/faq">FAQ</a> &middot;
            <a href="/contact">Contact</a>
            <br><br>
            <span style="color:var(--text-secondary);font-size:.65rem;opacity:.5">
                &copy; 2026 OAU CBE Practice
            </span>
        </div>
    </div>
</div>

<script>
// ==================== CHECK AUTH AND REDIRECT ====================
const token = localStorage.getItem('oau_token');
const API = 'https://oau-exam-api.onrender.com/api';

// If token exists, try to validate and redirect to app
if(token){
    fetch(API + '/auth/check-session', {
        headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(res => {
        if(res.ok){
            window.location.href = '/app';
        } else {
            // Token invalid, clear it
            localStorage.removeItem('oau_token');
            localStorage.removeItem('oau_user');
            // Show buttons (already visible)
        }
    })
    .catch(() => {
        // Network error, let user choose
        console.log('Network error, showing manual options');
    });
}

// ==================== THEME ====================
function initTheme(){
    const saved = localStorage.getItem('theme');
    if(saved === 'light'){
        document.body.classList.add('light-mode');
    } else {
        document.body.classList.remove('light-mode');
    }
}
initTheme();

// Listen for theme changes from other pages
window.addEventListener('storage', (e) => {
    if(e.key === 'theme'){
        initTheme();
    }
});
</script>

</body>
</html>
