<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Analysis • CEO Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh}
        .app{display:flex;min-height:100vh}
        .sidebar{width:260px;background:#0f172a;position:fixed;left:0;top:0;bottom:0;overflow-y:auto;z-index:100}
        .sidebar-header{padding:20px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:10px}
        .sidebar-header i{color:#f59e0b;font-size:1.3rem}
        .sidebar-header span{font-weight:800;color:#f1f5f9;font-size:1.1rem}
        .nav-menu{list-style:none;padding:8px}
        .nav-link{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#94a3b8;text-decoration:none;border-radius:8px;font-weight:500;font-size:.85rem;cursor:pointer}
        .nav-link:hover{background:#1e293b;color:#e2e8f0}
        .nav-link.active{background:#f59e0b;color:#000}
        .main-content{flex:1;margin-left:260px;padding:20px 28px}
        @media(max-width:768px){.sidebar{transform:translateX(-100%)}.main-content{margin-left:0;padding:16px}}
        .top-bar{background:#fff;padding:14px 20px;border-radius:14px;margin-bottom:24px;border:1px solid #e2e8f0}
        .top-bar h1{font-size:1.3rem;font-weight:700}
        .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
        @media(max-width:768px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
        .stat-card{background:#fff;border-radius:14px;padding:20px;border:1px solid #e2e8f0;text-align:center}
        .stat-card .num{font-size:2rem;font-weight:800}
        .stat-card .lbl{font-size:.75rem;color:#64748b;margin-top:4px}
        .card{background:#fff;border-radius:14px;padding:20px;border:1px solid #e2e8f0;margin-bottom:20px}
        .card h2{font-size:1rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .user-item{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#f8fafc;border-radius:8px;margin-bottom:4px}
        .user-avatar{width:40px;height:40px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;overflow:hidden}
        .user-avatar img{width:100%;height:100%;object-fit:cover}
        .badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.65rem;font-weight:600}
        .badge-success{background:#d1fae5;color:#065f46}
        .loading{text-align:center;padding:30px;color:#94a3b8}
        .loading i{animation:spin 1s linear infinite}
        @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header"><i class="fas fa-crown"></i><span>CEO Panel</span></div>
            <ul class="nav-menu">
                <li><a class="nav-link" href="ceo-panel.html"><i class="fas fa-clipboard-list"></i> Applications</a></li>
                <li><a class="nav-link active" href="appAnalysis.html"><i class="fas fa-chart-pie"></i> App Analysis</a></li>
            </ul>
            <div style="height:1px;background:#1e293b;margin:12px 8px"></div>
            <ul class="nav-menu">
                <li><a class="nav-link" href="adminDashboard.html"><i class="fas fa-th-large"></i> Admin Dashboard</a></li>
                <li><a class="nav-link" href="/app"><i class="fas fa-arrow-left"></i> Back to App</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="top-bar"><h1>📊 App Analysis</h1></div>
            <div class="stats-grid" id="overviewStats">
                <div class="stat-card"><div class="num" id="totalUsers" style="color:#3b82f6">—</div><div class="lbl">Total Users</div></div>
                <div class="stat-card"><div class="num" id="activeUsers" style="color:#10b981">—</div><div class="lbl">Active (7 days)</div></div>
                <div class="stat-card"><div class="num" id="totalAdmins" style="color:#f59e0b">—</div><div class="lbl">Admins</div></div>
                <div class="stat-card"><div class="num" id="totalQuestions" style="color:#7c3aed">—</div><div class="lbl">Questions</div></div>
                <div class="stat-card"><div class="num" id="totalCourses" style="color:#06b6d4">—</div><div class="lbl">Courses</div></div>
                <div class="stat-card"><div class="num" id="totalMaterials" style="color:#f97316">—</div><div class="lbl">Materials</div></div>
            </div>

            <div class="card">
                <h2><i class="fas fa-users"></i> Top Users by Exams Taken</h2>
                <div id="topUsers"><div class="loading"><i class="fas fa-spinner"></i> Loading...</div></div>
            </div>

            <div class="card">
                <h2><i class="fas fa-building"></i> Users by Faculty</h2>
                <div id="usersByFaculty"><div class="loading"><i class="fas fa-spinner"></i> Loading...</div></div>
            </div>
        </main>
    </div>

    <script>
        const API = 'https://oau-exam-api.onrender.com/api';
        const ceoPassword = sessionStorage.getItem('ceo_password');
        if (!ceoPassword) { window.location.href = 'ceo-panel.html'; }
        else { loadAnalysis(); }

        async function loadAnalysis() {
            try {
                const r = await fetch(API + '/admin-auth/app-analysis', { headers: {'x-ceo-password': ceoPassword} });
                const d = await r.json();
                document.getElementById('totalUsers').textContent = d.overview?.totalUsers || 0;
                document.getElementById('activeUsers').textContent = d.overview?.activeUsers || 0;
                document.getElementById('totalAdmins').textContent = d.overview?.totalAdmins || 0;
                document.getElementById('totalQuestions').textContent = d.overview?.totalQuestions || 0;
                document.getElementById('totalCourses').textContent = d.overview?.totalCourses || 0;
                document.getElementById('totalMaterials').textContent = d.overview?.totalMaterials || 0;

                const topUsers = document.getElementById('topUsers');
                if (d.topUsers?.length) {
                    topUsers.innerHTML = d.topUsers.map((u,i) => `
                        <div class="user-item">
                            <div class="user-avatar">${u.profilePicture ? `<img src="${u.profilePicture}">` : (u.fullName||'U').charAt(0)}</div>
                            <div style="flex:1"><strong>#${i+1} ${u.fullName||'Unknown'}</strong><br><span style="font-size:.7rem;color:#64748b">${u.faculty||'N/A'} | ${u.level||'100'}L | ${u.examsTaken||0} exams</span></div>
                            <span class="badge badge-success">🔥 ${u.currentStreak||0} streak</span>
                        </div>`).join('');
                }

                const facultyDiv = document.getElementById('usersByFaculty');
                if (d.usersByFaculty?.length) {
                    facultyDiv.innerHTML = d.usersByFaculty.map(f => `
                        <div class="user-item"><div style="flex:1"><strong>${f._id||'Unknown'}</strong></div><span style="font-weight:700">${f.count} users</span></div>`).join('');
                }
            } catch(e) { console.log('Analysis error:', e); }
        }
    </script>
</body>
</html>
