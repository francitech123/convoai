<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- Background Badge Shape -->
  <rect x="10" y="10" width="380" height="180" rx="20" fill="#0a0e1a" stroke="#2563eb" stroke-width="2"/>
  
  <!-- OAU Crest - Shield Shape -->
  <g transform="translate(60, 30)">
    <!-- Shield Outline -->
    <path d="M60 10 L110 10 L140 50 L140 110 L100 145 L60 110 L60 50 L90 10 Z" 
          fill="none" stroke="#2563eb" stroke-width="2.5"/>
    
    <!-- Shield Inner -->
    <path d="M65 15 L105 15 L132 52 L132 107 L100 138 L68 107 L68 52 L92 15 Z" 
          fill="rgba(37,99,235,0.08)" stroke="none"/>
    
    <!-- Book Icon -->
    <g transform="translate(85, 45)">
      <rect x="0" y="0" width="30" height="22" rx="2" fill="none" stroke="#2563eb" stroke-width="1.5"/>
      <line x1="15" y1="0" x2="15" y2="22" stroke="#2563eb" stroke-width="1.5"/>
      <path d="M3 5 L10 9 L17 5 L24 9 L27 5" stroke="#2563eb" stroke-width="1.2" fill="none"/>
      <line x1="4" y1="12" x2="10" y2="12" stroke="#2563eb" stroke-width="1"/>
      <line x1="4" y1="15" x2="10" y2="15" stroke="#2563eb" stroke-width="1"/>
      <line x1="20" y1="12" x2="26" y2="12" stroke="#2563eb" stroke-width="1"/>
      <line x1="20" y1="15" x2="26" y2="15" stroke="#2563eb" stroke-width="1"/>
    </g>
    
    <!-- Graduation Cap -->
    <g transform="translate(75, 75)">
      <polygon points="25,5 0,15 25,25 50,15" fill="none" stroke="#2563eb" stroke-width="1.8"/>
      <rect x="22" y="5" width="6" height="18" rx="1" fill="none" stroke="#2563eb" stroke-width="1.2"/>
      <line x1="50" y1="15" x2="58" y2="12" stroke="#2563eb" stroke-width="1.2"/>
    </g>
    
    <!-- Decorative Lines -->
    <line x1="70" y1="125" x2="130" y2="125" stroke="#2563eb" stroke-width="1"/>
    <line x1="75" y1="130" x2="125" y2="130" stroke="#2563eb" stroke-width="0.8" opacity="0.5"/>
  </g>
  
  <!-- Title: OAU CBE Practice -->
  <text x="200" y="65" font-family="'Segoe UI', 'Inter', sans-serif" font-size="28" font-weight="800" fill="#f0f4ff" letter-spacing="1.5">
    OAU <tspan fill="#2563eb">CBE</tspan> Practice
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="92" font-family="'Segoe UI', 'Inter', sans-serif" font-size="11" font-weight="500" fill="#8899bb" letter-spacing="3">
    COMPUTER BASED EXAM
  </text>
  
  <!-- Decorative bottom line -->
  <line x1="145" y1="105" x2="310" y2="105" stroke="#2563eb" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Tagline -->
  <text x="200" y="125" font-family="'Segoe UI', 'Inter', sans-serif" font-size="9" font-weight="400" fill="#8899bb" letter-spacing="4">
    EXAM READINESS &amp; EXCELLENCE
  </text>
  
  <!-- Version Badge -->
  <rect x="330" y="160" width="55" height="18" rx="9" fill="rgba(37,99,235,0.15)" stroke="#2563eb" stroke-width="1"/>
  <text x="357" y="173" font-family="'Segoe UI', 'Inter', sans-serif" font-size="8" font-weight="600" fill="#2563eb" text-anchor="middle">v2.0</text>
</svg>
