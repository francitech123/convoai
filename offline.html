<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline • OAU CBE Practice</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .offline-card{background:#1e293b;border-radius:24px;padding:40px 30px;max-width:400px;width:100%;text-align:center;border:1px solid #334155;box-shadow:0 20px 60px rgba(0,0,0,.3)}
        .offline-card .icon{font-size:4rem;color:#3b82f6;margin-bottom:16px}
        .offline-card h1{color:#f1f5f9;font-size:1.5rem;margin-bottom:8px}
        .offline-card p{color:#94a3b8;font-size:.9rem;line-height:1.6;margin-bottom:20px}
        .offline-card .btn{display:inline-block;padding:12px 24px;background:#3b82f6;color:#fff;border:none;border-radius:12px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;font-family:inherit}
        .offline-card .btn:hover{background:#2563eb;transform:translateY(-2px)}
        .offline-card .btn i{margin-right:8px}
        .offline-card .logo{width:80px;height:80px;object-fit:contain;margin-bottom:16px}
        .try-again{margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    </style>
</head>
<body>
    <div class="offline-card">
        <img src="/logo.svg" alt="OAU CBE Practice" class="logo">
        <div class="icon"><i class="fas fa-wifi-slash"></i></div>
        <h1>You're Offline</h1>
        <p>Please check your internet connection and try again. Some features may not be available offline.</p>
        <div class="try-again">
            <button class="btn" onclick="window.location.reload()"><i class="fas fa-sync-alt"></i> Retry</button>
            <a href="/app" class="btn" style="background:#475569"><i class="fas fa-home"></i> Dashboard</a>
        </div>
    </div>
</body>
</html>
