<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Results • OAU CBT Practice</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- MathJax Configuration -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                ignoreHtmlClass: 'no-mathjax',
                processHtmlClass: 'mathjax-process'
            },
            startup: {
                ready: () => {
                    MathJax.startup.defaultReady();
                    MathJax.startup.promise.then(() => {
                        console.log('✅ MathJax loaded');
                    });
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif}
        
        :root{
            --primary:#1e3a8a;
            --primary-light:#3b82f6;
            --success:#10b981;
            --warning:#f59e0b;
            --danger:#ef4444;
            --bg:#0f172a;
            --bg-soft:#111c33;
            --card:#1e293b;
            --card-2:#152033;
            --border:#334155;
            --text:#f1f5f9;
            --text-secondary:#94a3b8;
            --shadow:0 18px 40px rgba(0,0,0,.28);
            --brand-gradient:linear-gradient(135deg,#1e3a8a,#3b82f6);
            --radius:24px;
            --radius-sm:16px;
        }
        
        body.light-mode{
            --bg:#f4f7fb;
            --bg-soft:#edf3fb;
            --card:#ffffff;
            --card-2:#f8fbff;
            --border:#d7e2ef;
            --text:#0f172a;
            --text-secondary:#526173;
            --shadow:0 16px 36px rgba(15,23,42,.08);
        }
        
        body{background:radial-gradient(circle at top right,rgba(59,130,246,.08),transparent 25%),linear-gradient(180deg,var(--bg),#0b1324 100%);color:var(--text);min-height:100vh;transition:background .3s}
        
        /* Header */
        .topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);background:rgba(15,23,42,.95);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100}
        body.light-mode .topbar{background:rgba(255,255,255,.95)}
        .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
        .brand-logo{width:40px;height:40px;border-radius:12px;background:rgba(59,130,246,.12);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);overflow:hidden}
        .brand-logo svg{width:30px;height:30px}
        .brand-text{font-weight:700;font-size:1rem}
        .brand-text small{display:block;font-weight:400;font-size:.6rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.08em}
        .topbar-actions{display:flex;align-items:center;gap:8px}
        .icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:.9rem}
        .icon-btn:hover{background:var(--primary-light);color:#fff;border-color:var(--primary-light)}
        
        /* Container */
        .page{max-width:900px;margin:0 auto;padding:20px 16px 110px}
        
        /* Loading */
        .loading-spin{text-align:center;padding:60px 20px;color:var(--text-secondary)}
        .loading-spin i{font-size:2.5rem;animation:spin 1s linear infinite;display:block;margin-bottom:16px}
        @keyframes spin{to{transform:rotate(360deg)}}
        
        /* Result Card */
        .result-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:clamp(20px,3vw,32px);margin-bottom:16px;box-shadow:var(--shadow);animation:fadeIn .4s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        
        .result-header{text-align:center;margin-bottom:16px}
        .result-header .mode-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:.7rem;font-weight:600;background:rgba(59,130,246,.12);color:var(--primary-light)}
        .result-header .mode-badge.test{background:rgba(124,58,237,.12);color:#a78bfa}
        .result-header h2{font-size:clamp(1.1rem,2.5vw,1.4rem);font-weight:700;margin-top:8px;color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px}
        .result-header h2 i{color:var(--primary-light)}
        
        /* Score Circle */
        .score-circle{width:clamp(120px,22vw,160px);height:clamp(120px,22vw,160px);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 16px;font-size:clamp(2.2rem,3.5vw,3rem);font-weight:800;animation:popIn .5s ease .2s both}
        @keyframes popIn{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
        .score-circle.high{background:rgba(16,185,129,.12);color:var(--success);border:3px solid var(--success)}
        .score-circle.medium{background:rgba(245,158,11,.12);color:var(--warning);border:3px solid var(--warning)}
        .score-circle.low{background:rgba(239,68,68,.12);color:var(--danger);border:3px solid var(--danger)}
        .score-circle .grade{font-size:clamp(.7rem,1.2vw,.85rem);font-weight:600;margin-top:2px;opacity:.8}
        
        /* Stats Grid */
        .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
        @media(max-width:500px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
        .stat-item{background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;padding:clamp(10px,1.5vw,14px);text-align:center;transition:all .2s}
        .stat-item:hover{transform:translateY(-2px);border-color:var(--primary-light)}
        .stat-value{font-size:clamp(1rem,1.6vw,1.3rem);font-weight:800;color:var(--primary-light)}
        .stat-label{font-size:clamp(.55rem,.8vw,.65rem);color:var(--text-secondary);margin-top:3px}
        
        /* Encouragement */
        .encouragement{text-align:center;padding:14px;margin:12px 0;border-radius:12px;font-size:clamp(.8rem,1.1vw,.9rem);font-weight:500;line-height:1.5}
        .encouragement.great{background:rgba(16,185,129,.1);color:var(--success);border:1px solid rgba(16,185,129,.2)}
        .encouragement.good{background:rgba(245,158,11,.1);color:var(--warning);border:1px solid rgba(245,158,11,.2)}
        .encouragement.keep{background:rgba(239,68,68,.1);color:var(--danger);border:1px solid rgba(239,68,68,.2)}
        
        /* Question Review */
        .review-header{display:flex;justify-content:space-between;align-items:center;margin:20px 0 14px;flex-wrap:wrap;gap:8px}
        .review-header h3{font-size:clamp(.9rem,1.2vw,1rem);color:var(--text);display:flex;align-items:center;gap:8px}
        .review-summary{font-size:clamp(.65rem,.9vw,.7rem);color:var(--text-secondary);font-weight:500}
        
        .question-review{background:var(--card-2);border-radius:var(--radius-sm);padding:clamp(14px,2vw,18px);margin-bottom:10px;border:1px solid var(--border);transition:all .2s}
        .question-review:hover{transform:translateX(4px)}
        .question-review.correct{border-left:4px solid var(--success)}
        .question-review.wrong{border-left:4px solid var(--danger)}
        .question-review.unanswered{border-left:4px solid var(--warning)}
        
        .question-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
        .question-text{font-weight:600;font-size:clamp(.8rem,1.2vw,.88rem);color:var(--text);flex:1;line-height:1.6}
        .question-status{font-size:.65rem;padding:2px 10px;border-radius:12px;font-weight:600;white-space:nowrap;flex-shrink:0}
        .question-status.correct{background:rgba(16,185,129,.15);color:var(--success)}
        .question-status.wrong{background:rgba(239,68,68,.15);color:var(--danger)}
        .question-status.unanswered{background:rgba(245,158,11,.15);color:var(--warning)}
        
        .options{margin-left:clamp(8px,1.5vw,14px)}
        .option{font-size:clamp(.72rem,1vw,.78rem);padding:4px 0;color:var(--text-secondary);display:flex;align-items:center;gap:6px;line-height:1.4}
        .option .opt-icon{font-size:.6rem;width:18px;text-align:center;flex-shrink:0}
        .option.correct-answer{color:var(--success);font-weight:600}
        .option.correct-answer .opt-icon{color:var(--success)}
        .option.user-wrong{color:var(--danger);font-weight:600}
        .option.user-wrong .opt-icon{color:var(--danger)}
        
        .answer-row{font-size:.72rem;margin-top:6px;padding:6px 10px;background:var(--bg);border-radius:8px;color:var(--text-secondary);line-height:1.4}
        .answer-row strong.correct{color:var(--success)}
        .answer-row strong.wrong{color:var(--danger)}
        .answer-row strong.unanswered{color:var(--warning)}
        
        .explanation{background:var(--bg);border-radius:8px;padding:clamp(8px,1.2vw,12px);margin-top:8px;font-size:clamp(.7rem,.9vw,.75rem);color:var(--text-secondary);border-left:3px solid var(--primary-light);line-height:1.5}
        .explanation i{color:var(--primary-light);margin-right:4px}
        
        /* Buttons */
        .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border:none;border-radius:14px;font-weight:600;font-size:.82rem;cursor:pointer;transition:all .2s;text-decoration:none;font-family:inherit}
        .btn-primary{background:var(--brand-gradient);color:#fff}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(59,130,246,.3)}
        .btn-outline{background:transparent;color:var(--text);border:2px solid var(--border)}
        .btn-outline:hover{background:var(--card-2);border-color:var(--primary-light)}
        .btn-test{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff}
        .btn-test:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(124,58,237,.3)}
        
        .action-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
        .action-buttons .btn{min-width:140px;justify-content:center}
        
        /* Empty State */
        .empty-state{text-align:center;padding:clamp(40px,8vw,60px) 20px}
        .empty-state i{font-size:3.5rem;color:var(--text-secondary);margin-bottom:16px;opacity:.4}
        .empty-state h3{font-size:1.2rem;margin-bottom:6px;color:var(--text)}
        .empty-state p{color:var(--text-secondary);font-size:.85rem;margin-bottom:16px}
        .empty-state ul{list-style:none;padding:0;margin:12px auto;max-width:320px}
        .empty-state ul li{color:var(--text-secondary);font-size:.82rem;padding:4px 0}
        
        /* MathJax */
        .mathjax-process mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%;display:inline-block;vertical-align:middle}
        .question-text .mathjax-process mjx-container{display:inline}
        
        /* Scrollbar */
        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-track{background:var(--bg-soft);border-radius:4px}
        ::-webkit-scrollbar-thumb{background:var(--primary-light);border-radius:4px}
        
        @media(max-width:480px){.page{padding:12px 10px 100px}.topbar{padding:12px 14px}.brand-text{font-size:.85rem}.action-buttons .btn{min-width:120px;padding:10px 16px;font-size:.75rem}}
    </style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
    <a href="/app" class="brand">
        <div class="brand-logo">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="85" fill="none" stroke="#3b82f6" stroke-width="3"/>
                <path id="topArc" d="M 35 100 A 65 65 0 0 1 165 100" fill="none"/>
                <text font-size="15" font-weight="900" fill="#3b82f6" letter-spacing="2.5">
                    <textPath href="#topArc" startOffset="50%" text-anchor="middle">OAU</textPath>
                </text>
                <path id="bottomArc" d="M 35 100 A 65 65 0 0 0 165 100" fill="none"/>
                <text font-size="6.5" font-weight="800" fill="#1e3a8a" letter-spacing="1">
                    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">EXAM CBT</textPath>
                </text>
                <circle cx="100" cy="100" r="16" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
                <text x="100" y="104" font-size="6.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing=".8">OAU</text>
            </svg>
        </div>
        <div class="brand-text">Results <small>OAU CBT Practice</small></div>
    </a>
    <div class="topbar-actions">
        <button class="icon-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
        <a href="/app" class="icon-btn" aria-label="Dashboard"><i class="fas fa-arrow-left"></i></a>
    </div>
</header>

<!-- MAIN CONTENT -->
<div class="page" id="appContainer">
    <div class="loading-spin" id="loadingSpinner">
        <i class="fas fa-spinner fa-spin"></i>
        <p>Loading your results...</p>
    </div>
    <div id="resultContent" style="display:none"></div>
</div>

<script>
    const API = 'https://oau-exam-api.onrender.com/api';
    const token = localStorage.getItem('oau_token');
    if (!token) { window.location.href = '/login'; }

    // ==================== THEME ====================
    function initTheme() {
        const saved = localStorage.getItem('theme');
        const btn = document.getElementById('themeToggleBtn');
        if (saved === 'light') {
            document.body.classList.add('light-mode');
            btn.innerHTML = '<i class="fas fa-sun"></i>';
        } else {
            btn.innerHTML = '<i class="fas fa-moon"></i>';
        }
    }

    window.toggleTheme = function() {
        const isLight = document.body.classList.toggle('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        const btn = document.getElementById('themeToggleBtn');
        btn.innerHTML = isLight ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        if (token) {
            fetch(API + '/auth/preferences', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ darkMode: !isLight })
            }).catch(() => {});
        }
    };

    // ==================== STORAGE ====================
    const RESULT_STORAGE_KEY = 'lastExamResult';
    const RESULT_TIMESTAMP_KEY = 'lastResultTimestamp';

    function saveResultPersistent(data) {
        try {
            localStorage.setItem(RESULT_STORAGE_KEY, JSON.stringify(data));
            localStorage.setItem(RESULT_TIMESTAMP_KEY, Date.now().toString());
        } catch(e) { console.error('Save error:', e); }
    }

    function getPersistentResult() {
        try {
            const data = localStorage.getItem(RESULT_STORAGE_KEY);
            return data ? JSON.parse(data) : null;
        } catch(e) { return null; }
    }

    function getResultData() {
        // Check sessionStorage
        let result = sessionStorage.getItem('examResult') || sessionStorage.getItem('testResult');
        if (result) {
            try {
                const parsed = JSON.parse(result);
                saveResultPersistent(parsed);
                sessionStorage.removeItem('examResult');
                sessionStorage.removeItem('testResult');
                return parsed;
            } catch(e) {}
        }

        // Check pending submission
        let pending = localStorage.getItem('pendingExamSubmission') || localStorage.getItem('pendingTestSubmission');
        if (pending) {
            try {
                const submission = JSON.parse(pending);
                if (submission.data) {
                    const data = submission.data;
                    const resultData = {
                        course: data.courseCode,
                        correctCount: data.correctCount,
                        totalQuestions: data.totalQuestions,
                        percentage: data.percentage,
                        timeSpent: data.timeSpent,
                        mode: data.mode || 'exam',
                        questions: data.questions ? data.questions.map((q, i) => ({
                            text: q.text,
                            options: q.options,
                            correctOption: q.correctOption,
                            userAnswer: data.answers ? data.answers[i] : null,
                            explanation: q.explanation || ''
                        })) : null
                    };
                    saveResultPersistent(resultData);
                    localStorage.removeItem('pendingExamSubmission');
                    localStorage.removeItem('pendingTestSubmission');
                    return resultData;
                }
            } catch(e) {}
        }

        // Check persistent storage
        const persistent = getPersistentResult();
        if (persistent) return persistent;

        return null;
    }

    // ==================== LOAD RESULT ====================
    async function loadResult() {
        let result = getResultData();

        if (!result) {
            try {
                const response = await fetch(API + '/exams/history', { 
                    headers: { 'Authorization': 'Bearer ' + token } 
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.scores && data.scores.length > 0) {
                        const latest = data.scores[data.scores.length - 1];
                        result = {
                            course: latest.courseCode || 'Unknown',
                            correctCount: latest.correctAnswers || latest.score || 0,
                            totalQuestions: latest.totalQuestions || 0,
                            percentage: latest.percentage || 0,
                            timeSpent: latest.timeSpent || 0,
                            mode: latest.mode || 'exam',
                            questions: null
                        };
                        saveResultPersistent(result);
                    }
                }
            } catch(e) { console.error('Backend fetch error:', e); }
        }

        if (!result) {
            showEmptyState();
            return;
        }

        displayResult(result);
    }

    function showEmptyState() {
        document.getElementById('loadingSpinner').style.display = 'none';
        document.getElementById('resultContent').innerHTML = `
            <div class="empty-state">
                <i class="fas fa-file-alt"></i>
                <h3>No Results Found</h3>
                <p>Take an exam or test to see your performance here!</p>
                <ul>
                    <li>📝 Exams simulate real CBT conditions</li>
                    <li>🧪 Tests help you practice with hints</li>
                    <li>📊 Track your progress over time</li>
                </ul>
                <div class="action-buttons">
                    <a href="/exam" class="btn btn-primary"><i class="fas fa-pen"></i> Take Exam</a>
                    <a href="/test" class="btn btn-test"><i class="fas fa-flask"></i> Practice Test</a>
                </div>
            </div>
        `;
        document.getElementById('resultContent').style.display = 'block';
    }

    function displayResult(result) {
        document.getElementById('loadingSpinner').style.display = 'none';

        const percentage = result.percentage || 0;
        let scoreClass = 'low', grade = 'F';
        if (percentage >= 90) { scoreClass = 'high'; grade = 'A+'; }
        else if (percentage >= 80) { scoreClass = 'high'; grade = 'A'; }
        else if (percentage >= 70) { scoreClass = 'high'; grade = 'B'; }
        else if (percentage >= 60) { scoreClass = 'medium'; grade = 'C'; }
        else if (percentage >= 50) { scoreClass = 'medium'; grade = 'D'; }

        const timeSpent = result.timeSpent || 0;
        const minutes = Math.floor(timeSpent / 60000);
        const seconds = Math.floor((timeSpent % 60000) / 1000);
        const timeString = `${minutes}m ${seconds}s`;

        const isExam = result.mode === 'exam';
        const modeLabel = isExam ? '📝 Exam Mode' : '🧪 Test Mode';
        const modeClass = isExam ? '' : 'test';

        let encClass = 'keep', encMessage = '💪 Keep practicing! Review the explanations and try again.';
        if (percentage >= 80) { encClass = 'great'; encMessage = '🎉 Outstanding performance! You\'re a champion!'; }
        else if (percentage >= 70) { encClass = 'great'; encMessage = '🌟 Great work! You\'re well prepared.'; }
        else if (percentage >= 60) { encClass = 'good'; encMessage = '👍 Good effort! You\'re on the right track.'; }
        else if (percentage >= 50) { encClass = 'good'; encMessage = '📚 Nice try! Review the explanations and practice more.'; }

        // Question review
        let questionsHtml = '';
        if (result.questions && result.questions.length > 0) {
            const correctCount = result.questions.filter(q => q.userAnswer === q.correctOption).length;
            const wrongCount = result.questions.filter(q => q.userAnswer !== null && q.userAnswer !== q.correctOption).length;
            const unansweredCount = result.questions.filter(q => q.userAnswer === null || q.userAnswer === undefined).length;

            questionsHtml = `
                <div class="review-header">
                    <h3><i class="fas fa-list-check"></i> Question Review</h3>
                    <span class="review-summary">✅ ${correctCount} | ❌ ${wrongCount} | ⬜ ${unansweredCount}</span>
                </div>`;

            questionsHtml += result.questions.map((q, idx) => {
                const isCorrect = q.userAnswer === q.correctOption;
                const isUnanswered = q.userAnswer === null || q.userAnswer === undefined;
                const userLetter = !isUnanswered ? String.fromCharCode(65 + q.userAnswer) : '—';
                const correctLetter = String.fromCharCode(65 + q.correctOption);

                let statusClass = 'wrong', statusText = '❌ Wrong';
                if (isCorrect) { statusClass = 'correct'; statusText = '✅ Correct'; }
                if (isUnanswered) { statusClass = 'unanswered'; statusText = '⬜ Unanswered'; }

                let optionsHtml = '';
                if (q.options && q.options.length) {
                    optionsHtml = '<div class="options">';
                    q.options.forEach((opt, optIdx) => {
                        let cls = '';
                        let icon = '';
                        if (optIdx === q.correctOption) { cls = 'correct-answer'; icon = '✓'; }
                        if (optIdx === q.userAnswer && optIdx !== q.correctOption) { cls = 'user-wrong'; icon = '✗'; }
                        if (optIdx === q.userAnswer && optIdx === q.correctOption) { cls = 'correct-answer'; icon = '✓'; }
                        optionsHtml += `<div class="option ${cls}"><span class="opt-icon">${icon}</span>${String.fromCharCode(65+optIdx)}. <span class="mathjax-process">${opt}</span></div>`;
                    });
                    optionsHtml += `</div>`;
                    optionsHtml += `<div class="answer-row">Your answer: <strong class="${isCorrect ? 'correct' : isUnanswered ? 'unanswered' : 'wrong'}">${userLetter}</strong> | Correct: <strong class="correct">${correctLetter}</strong></div>`;
                }

                let explanationHtml = '';
                if (q.explanation && q.explanation.trim()) {
                    explanationHtml = `<div class="explanation"><i class="fas fa-info-circle"></i> <span class="mathjax-process">${q.explanation}</span></div>`;
                }

                return `<div class="question-review ${isCorrect ? 'correct' : isUnanswered ? 'unanswered' : 'wrong'}">
                    <div class="question-header">
                        <div class="question-text mathjax-process">${idx + 1}. ${q.text}</div>
                        <span class="question-status ${statusClass}">${statusText}</span>
                    </div>
                    ${optionsHtml}
                    ${explanationHtml}
                </div>`;
            }).join('');
        } else {
            questionsHtml = `<p style="color:var(--text-secondary);text-align:center;padding:16px;font-size:.85rem">📋 Detailed question review not available for this session.</p>`;
        }

        const html = `
            <div class="result-card">
                <div class="result-header">
                    <span class="mode-badge ${modeClass}">${modeLabel}</span>
                    <h2><i class="fas ${isExam ? 'fa-file-alt' : 'fa-flask'}" style="color:${isExam ? 'var(--primary-light)' : '#a78bfa'}"></i> ${result.course || 'Results'}</h2>
                </div>
                
                <div class="score-circle ${scoreClass}">
                    ${percentage}%
                    <span class="grade">Grade: ${grade}</span>
                </div>
                
                <div class="encouragement ${encClass}">${encMessage}</div>
                
                <div class="stats-grid">
                    <div class="stat-item"><div class="stat-value">${result.correctCount || 0}/${result.totalQuestions || 0}</div><div class="stat-label">✅ Correct</div></div>
                    <div class="stat-item"><div class="stat-value">${timeString}</div><div class="stat-label">⏱️ Time</div></div>
                    <div class="stat-item"><div class="stat-value">${result.totalQuestions ? Math.round((result.correctCount / result.totalQuestions) * 100) : 0}%</div><div class="stat-label">📊 Accuracy</div></div>
                    <div class="stat-item"><div class="stat-value">${isExam ? 'Exam' : 'Test'}</div><div class="stat-label">📋 Mode</div></div>
                </div>
            </div>
            
            <div class="result-card">${questionsHtml}</div>
            
            <div class="action-buttons">
                <a href="/exam" class="btn btn-primary"><i class="fas fa-pen"></i> Retake Exam</a>
                <a href="/test" class="btn btn-test"><i class="fas fa-flask"></i> Retake Test</a>
                <a href="/app" class="btn btn-outline"><i class="fas fa-home"></i> Dashboard</a>
            </div>
        `;

        document.getElementById('resultContent').innerHTML = html;
        document.getElementById('resultContent').style.display = 'block';

        // Trigger MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([document.getElementById('resultContent')]).catch(console.error);
        }
    }

    // ==================== INIT ====================
    initTheme();
    loadResult();
</script>

</body>
</html>
