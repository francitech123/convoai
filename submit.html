<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Results • OAU Exam CBT Practice</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- MathJax Configuration -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                ignoreHtmlClass: 'no-mathjax',
                processHtmlClass: 'mathjax-process'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Inter',sans-serif}
        :root{--primary:#1e3a8a;--primary-light:#3b82f6;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f1f5f9;--text2:#94a3b8}
        body.light-mode{--bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#0f172a;--text2:#475569}
        body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes popIn{0%{transform:scale(0.5);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
        
        .header{background:rgba(15,23,42,.98);backdrop-filter:blur(10px);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
        body.light-mode .header{background:rgba(255,255,255,.98)}
        .header .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.1rem;color:var(--text);text-decoration:none}
        .header-actions{display:flex;align-items:center;gap:12px}
        .back-link{color:var(--text2);text-decoration:none;display:flex;align-items:center;gap:6px;font-size:.9rem}
        .back-link:hover{color:var(--text)}
        .theme-toggle{background:rgba(59,130,246,0.15);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
        .theme-toggle:hover{background:var(--primary-light);color:#fff}
        
        .container{max-width:900px;margin:0 auto;padding:20px 20px 100px 20px;width:100%}
        @media(min-width:768px){.container{max-width:95%}}
        @media(min-width:1024px){.container{max-width:90%}}
        @media(min-width:1440px){.container{max-width:85%}}
        
        .result-card{background:var(--card);border-radius:20px;padding:clamp(16px,3vw,28px);margin-bottom:20px;border:1px solid var(--border);animation:fadeIn .4s ease}
        .result-title{font-size:clamp(1.1rem,2vw,1.4rem);font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px;color:var(--text)}
        .result-subtitle{font-size:clamp(.78rem,1.2vw,.85rem);color:var(--text2);margin-bottom:16px;text-align:center}
        
        .score-circle{width:clamp(120px,20vw,150px);height:clamp(120px,20vw,150px);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 16px;font-size:clamp(2rem,3vw,2.8rem);font-weight:800;animation:popIn .5s ease .2s both}
        .score-circle.high{background:rgba(16,185,129,.15);color:var(--success);border:3px solid var(--success)}
        .score-circle.medium{background:rgba(245,158,11,.15);color:var(--warning);border:3px solid var(--warning)}
        .score-circle.low{background:rgba(239,68,68,.15);color:var(--danger);border:3px solid var(--danger)}
        .score-circle .grade{font-size:clamp(.75rem,1.2vw,.9rem);font-weight:600;margin-top:2px}
        
        .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.5vw,12px);margin:16px 0}
        @media(max-width:500px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
        .stat-item{background:var(--bg);border-radius:12px;padding:clamp(12px,2vw,16px) 10px;text-align:center;border:1px solid var(--border);animation:slideUp .4s ease both}
        .stat-item:nth-child(1){animation-delay:.3s}
        .stat-item:nth-child(2){animation-delay:.4s}
        .stat-item:nth-child(3){animation-delay:.5s}
        .stat-item:nth-child(4){animation-delay:.6s}
        .stat-value{font-size:clamp(1.1rem,1.8vw,1.4rem);font-weight:800;color:var(--primary-light)}
        .stat-label{font-size:clamp(.62rem,1vw,.68rem);color:var(--text2);margin-top:4px}
        
        .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border:none;border-radius:14px;font-weight:600;font-size:.85rem;cursor:pointer;transition:all .2s;text-decoration:none;justify-content:center}
        .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(59,130,246,.3)}
        .btn-outline{background:transparent;color:var(--primary-light);border:2px solid var(--primary-light)}
        .btn-outline:hover{background:rgba(59,130,246,.1);transform:translateY(-2px)}
        .btn-test{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff}
        .btn-test:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(124,58,237,.3)}
        
        .mode-badge{display:inline-block;padding:6px 16px;border-radius:20px;font-size:.75rem;font-weight:600;margin-bottom:8px}
        .mode-badge.exam{background:rgba(59,130,246,.15);color:var(--primary-light)}
        .mode-badge.test{background:rgba(167,139,250,.15);color:#a78bfa}
        
        .question-review{background:var(--card);border-radius:16px;padding:clamp(14px,2vw,18px);margin-bottom:12px;border:1px solid var(--border);transition:all .2s}
        .question-review.correct{border-left:4px solid var(--success)}
        .question-review.wrong{border-left:4px solid var(--danger)}
        .question-review.unanswered{border-left:4px solid var(--warning)}
        .question-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
        .question-text{font-weight:600;font-size:clamp(.82rem,1.3vw,.92rem);color:var(--text);flex:1;line-height:1.6}
        .question-status{font-size:.7rem;padding:3px 10px;border-radius:12px;font-weight:600;white-space:nowrap;flex-shrink:0}
        .question-status.correct{background:rgba(16,185,129,.15);color:var(--success)}
        .question-status.wrong{background:rgba(239,68,68,.15);color:var(--danger)}
        .question-status.unanswered{background:rgba(245,158,11,.15);color:var(--warning)}
        
        .options{margin-left:clamp(8px,2vw,16px)}
        .option{font-size:clamp(.75rem,1.1vw,.82rem);padding:5px 0;color:var(--text2);display:flex;align-items:center;gap:8px;line-height:1.5}
        .option.correct-answer{color:var(--success);font-weight:600}
        .option.correct-answer::before{content:'✓';font-weight:700;font-size:.7rem;flex-shrink:0;width:16px;text-align:center}
        .option.user-wrong{color:var(--danger);font-weight:600}
        .option.user-wrong::before{content:'✗';font-weight:700;font-size:.7rem;flex-shrink:0;width:16px;text-align:center}
        .option-icon{font-size:.7rem;width:16px;text-align:center;flex-shrink:0}
        
        .answer-row{font-size:.75rem;margin-top:8px;padding:8px 12px;background:var(--bg);border-radius:8px;color:var(--text2);line-height:1.5}
        .explanation{background:var(--bg);border-radius:10px;padding:clamp(8px,1.5vw,12px);margin-top:8px;font-size:clamp(.72rem,1vw,.78rem);color:var(--text2);border-left:3px solid var(--primary-light);line-height:1.6}
        .explanation i{color:var(--primary-light);margin-right:6px}
        
        .encouragement{text-align:center;padding:16px;margin:12px 0;border-radius:12px;font-size:clamp(.8rem,1.2vw,.9rem);font-weight:500;line-height:1.5}
        .encouragement.great{background:rgba(16,185,129,.1);color:var(--success);border:1px solid rgba(16,185,129,.3)}
        .encouragement.good{background:rgba(245,158,11,.1);color:var(--warning);border:1px solid rgba(245,158,11,.3)}
        .encouragement.keep{background:rgba(239,68,68,.1);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
        
        .review-header{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px;flex-wrap:wrap;gap:8px}
        .review-header h3{font-size:clamp(.9rem,1.3vw,1rem);color:var(--text);display:flex;align-items:center;gap:8px}
        .review-summary{font-size:clamp(.7rem,1vw,.78rem);color:var(--text2)}
        
        .bottom-nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.98);backdrop-filter:blur(12px);padding:8px 20px;border-radius:50px;display:flex;gap:8px;z-index:98;border:1px solid var(--border)}
        body.light-mode .bottom-nav{background:rgba(255,255,255,.98)}
        .nav-item{display:flex;flex-direction:column;align-items:center;padding:6px 12px;border-radius:30px;color:var(--text2);text-decoration:none;font-size:.65rem;transition:all .2s}
        .nav-item i{font-size:1.1rem;margin-bottom:2px}
        .nav-item.active{background:var(--primary);color:#fff}
        
        .empty-state{text-align:center;padding:clamp(40px,8vw,60px) 20px}
        .empty-state i{font-size:4rem;color:var(--text2);margin-bottom:16px;opacity:.5}
        .empty-state h3{font-size:1.2rem;margin-bottom:8px;color:var(--text)}
        .empty-state p{color:var(--text2);margin-bottom:20px}
        
        .loading-spin{text-align:center;padding:60px}
        .loading-spin i{font-size:2rem;animation:spin 1s linear infinite;color:var(--primary-light)}
        @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        
        .action-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
        
        .mathjax-process mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}
        
        .debug-info{background:var(--bg);border-radius:8px;padding:12px;margin-top:12px;font-size:.7rem;color:var(--text2);font-family:monospace;display:none}
        .debug-info.show{display:block}
    </style>
</head>
<body>
    <header class="header">
        <a href="/app" class="logo"><span>🎓</span><span>OAU Exam CBT Practice</span></a>
        <div class="header-actions">
            <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
            <a href="/app" class="back-link"><i class="fas fa-arrow-left"></i> Dashboard</a>
        </div>
    </header>

    <div class="container" id="container">
        <div class="loading-spin" id="loadingSpinner">
            <i class="fas fa-spinner fa-spin"></i>
            <p style="margin-top:12px">Loading your results...</p>
        </div>
        <div id="resultContent" style="display:none"></div>
        <div class="debug-info" id="debugInfo">
            <strong>Debug Info:</strong>
            <div id="debugOutput"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/app" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="/exam" class="nav-item"><i class="fas fa-pen"></i><span>Exam</span></a>
        <a href="/test" class="nav-item"><i class="fas fa-flask"></i><span>Test</span></a>
        <a href="/ai" class="nav-item"><i class="fas fa-robot"></i><span>AI</span></a>
        <a href="/profile" class="nav-item"><i class="fas fa-user"></i><span>Me</span></a>
    </nav>

    <script>
        const API = 'https://oau-exam-api.onrender.com/api';
        const token = localStorage.getItem('oau_token');
        if (!token) { window.location.href = '/login'; }

        // ==================== THEME ====================
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('themeToggleBtn').innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                document.getElementById('themeToggleBtn').innerHTML = '<i class="fas fa-moon"></i>';
            }
        }
        
        window.toggleTheme = function() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            document.getElementById('themeToggleBtn').innerHTML = isLight ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            if (token) {
                fetch(API + '/auth/preferences', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ darkMode: !isLight })
                }).catch(() => {});
            }
        };

        // ==================== STORAGE KEYS ====================
        const RESULT_STORAGE_KEY = 'lastExamResult';
        const RESULT_TIMESTAMP_KEY = 'lastResultTimestamp';

        // ==================== SAVE RESULT PERSISTENTLY ====================
        function saveResultPersistent(resultData) {
            try {
                localStorage.setItem(RESULT_STORAGE_KEY, JSON.stringify(resultData));
                localStorage.setItem(RESULT_TIMESTAMP_KEY, Date.now().toString());
                console.log('✅ Result saved persistently');
            } catch(e) {
                console.error('Failed to save result:', e);
            }
        }

        // ==================== GET PERSISTENT RESULT ====================
        function getPersistentResult() {
            try {
                const data = localStorage.getItem(RESULT_STORAGE_KEY);
                if (data) {
                    return JSON.parse(data);
                }
            } catch(e) {
                console.error('Failed to get persistent result:', e);
            }
            return null;
        }

        // ==================== CLEAR PERSISTENT RESULT ====================
        function clearPersistentResult() {
            localStorage.removeItem(RESULT_STORAGE_KEY);
            localStorage.removeItem(RESULT_TIMESTAMP_KEY);
            console.log('🗑️ Persistent result cleared');
        }

        // ==================== GET RESULT DATA ====================
        function getResultData() {
            // 1. Check sessionStorage for new result (from current session)
            let result = sessionStorage.getItem('examResult') || sessionStorage.getItem('testResult');
            console.log('🔍 SessionStorage result:', result ? 'Found' : 'Not found');
            
            if (result) {
                try {
                    const parsed = JSON.parse(result);
                    console.log('📊 Parsed sessionStorage result:', parsed);
                    // Save to persistent storage
                    saveResultPersistent(parsed);
                    // Clear sessionStorage
                    sessionStorage.removeItem('examResult');
                    sessionStorage.removeItem('testResult');
                    return parsed;
                } catch(e) {
                    console.error('Error parsing sessionStorage:', e);
                }
            }
            
            // 2. Check localStorage for pending submission
            let pending = localStorage.getItem('pendingExamSubmission') || localStorage.getItem('pendingTestSubmission');
            console.log('🔍 Pending submission:', pending ? 'Found' : 'Not found');
            
            if (pending) {
                try {
                    const submission = JSON.parse(pending);
                    if (submission.data) {
                        const data = submission.data;
                        const resultData = {
                            course: data.courseCode,
                            correctCount: data.correctCount,
                            totalQuestions: data.totalQuestions,
                            percentage: data.percentage,
                            timeSpent: data.timeSpent,
                            mode: data.mode || 'exam',
                            questions: data.questions ? data.questions.map((q, i) => ({
                                text: q.text,
                                options: q.options,
                                correctOption: q.correctOption,
                                userAnswer: data.answers ? data.answers[i] : null,
                                explanation: q.explanation || ''
                            })) : null
                        };
                        console.log('📊 Parsed pending submission:', resultData);
                        // Save to persistent storage and clear pending
                        saveResultPersistent(resultData);
                        localStorage.removeItem('pendingExamSubmission');
                        localStorage.removeItem('pendingTestSubmission');
                        return resultData;
                    }
                } catch(e) {
                    console.error('Error parsing pending submission:', e);
                }
            }
            
            // 3. Check persistent storage (last saved result)
            const persistentResult = getPersistentResult();
            console.log('🔍 Persistent result:', persistentResult ? 'Found' : 'Not found');
            if (persistentResult) {
                return persistentResult;
            }
            
            console.log('❌ No result found anywhere');
            return null;
        }

        // ==================== LOAD & DISPLAY ====================
        async function loadResult() {
            // Show debug info
            const debugEl = document.getElementById('debugInfo');
            const debugOutput = document.getElementById('debugOutput');
            debugEl.classList.add('show');
            
            // First try to get result from storage
            let result = getResultData();
            
            // If no result in storage, try backend history
            if (!result) {
                debugOutput.innerHTML += '<br>📡 Trying backend history...';
                try {
                    const response = await fetch(API + '/exams/history', { 
                        headers: { 'Authorization': 'Bearer ' + token } 
                    });
                    if (response.ok) {
                        const data = await response.json();
                        debugOutput.innerHTML += `<br>✅ Backend response: ${data.success ? 'Success' : 'Failed'}`;
                        if (data.success && data.scores && data.scores.length > 0) {
                            const latest = data.scores[data.scores.length - 1];
                            result = {
                                course: latest.courseCode || 'Unknown',
                                correctCount: latest.correctAnswers || latest.score || 0,
                                totalQuestions: latest.totalQuestions || 0,
                                percentage: latest.percentage || 0,
                                timeSpent: latest.timeSpent || 0,
                                mode: latest.mode || 'exam',
                                questions: null
                            };
                            debugOutput.innerHTML += `<br>📊 Found ${data.scores.length} scores, latest: ${result.percentage}%`;
                            // Save to persistent storage
                            saveResultPersistent(result);
                        } else {
                            debugOutput.innerHTML += `<br>⚠️ No scores found in history`;
                        }
                    } else {
                        debugOutput.innerHTML += `<br>❌ Backend error: ${response.status}`;
                    }
                } catch(e) {
                    console.error('Backend fetch error:', e);
                    debugOutput.innerHTML += `<br>❌ Backend fetch error: ${e.message}`;
                }
            }
            
            // If still no result, show empty state
            if (!result) {
                debugOutput.innerHTML += '<br>❌ No result found, showing empty state';
                showEmptyState();
                return;
            }
            
            debugOutput.innerHTML += `<br>✅ Result found: ${result.percentage}% on ${result.course}`;
            displayResult(result);
        }

        function showEmptyState() {
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('resultContent').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-file-alt"></i>
                    <h3>No Results Found</h3>
                    <p>We couldn't find any exam or test data. This could be because:</p>
                    <ul style="text-align:left;max-width:350px;margin:16px auto;color:var(--text2);font-size:.85rem;line-height:1.8">
                        <li>• You haven't taken any exams or tests yet</li>
                        <li>• The submission didn't complete properly</li>
                        <li>• Your session may have expired</li>
                    </ul>
                    <div class="action-buttons">
                        <a href="/exam" class="btn btn-primary"><i class="fas fa-pen"></i> Take an Exam</a>
                        <a href="/test" class="btn btn-test"><i class="fas fa-flask"></i> Practice Test</a>
                        <a href="/app" class="btn btn-outline"><i class="fas fa-home"></i> Dashboard</a>
                    </div>
                </div>
            `;
            document.getElementById('resultContent').style.display = 'block';
        }

        function displayResult(result) {
            document.getElementById('loadingSpinner').style.display = 'none';
            
            const percentage = result.percentage || 0;
            let scoreClass = 'low', grade = 'F';
            if (percentage >= 90) { scoreClass = 'high'; grade = 'A+'; }
            else if (percentage >= 80) { scoreClass = 'high'; grade = 'A'; }
            else if (percentage >= 70) { scoreClass = 'high'; grade = 'B'; }
            else if (percentage >= 60) { scoreClass = 'medium'; grade = 'C'; }
            else if (percentage >= 50) { scoreClass = 'medium'; grade = 'D'; }
            
            const timeSpent = result.timeSpent || 0;
            const minutes = Math.floor(timeSpent / 60000);
            const seconds = Math.floor((timeSpent % 60000) / 1000);
            const timeString = `${minutes}m ${seconds}s`;
            
            const isExam = result.mode === 'exam';
            const modeLabel = isExam ? '📝 Exam Mode' : '🧪 Test Mode';
            const modeClass = isExam ? 'exam' : 'test';
            
            let encClass = 'keep', encMessage = '💪 Keep practicing! Review the explanations and try again. Every attempt makes you better!';
            if (percentage >= 80) { encClass = 'great'; encMessage = '🎉 Outstanding performance! You\'re a champion! Keep up the excellent work!'; }
            else if (percentage >= 70) { encClass = 'great'; encMessage = '🌟 Great work! You\'re well prepared. A little more practice and you\'ll ace it!'; }
            else if (percentage >= 60) { encClass = 'good'; encMessage = '👍 Good effort! You\'re on the right track. Focus on the questions you missed.'; }
            else if (percentage >= 50) { encClass = 'good'; encMessage = '📚 Nice try! Review the explanations and practice more. You\'re getting there!'; }
            
            // Question review section
            let questionsHtml = '';
            if (result.questions && result.questions.length > 0) {
                const correctCount = result.questions.filter(q => q.userAnswer === q.correctOption).length;
                const wrongCount = result.questions.filter(q => q.userAnswer !== null && q.userAnswer !== q.correctOption).length;
                const unansweredCount = result.questions.filter(q => q.userAnswer === null || q.userAnswer === undefined).length;
                
                questionsHtml = `
                    <div class="review-header">
                        <h3><i class="fas fa-list-check"></i> Question Review</h3>
                        <span class="review-summary">✅ ${correctCount} | ❌ ${wrongCount} | ⬜ ${unansweredCount}</span>
                    </div>`;
                
                questionsHtml += result.questions.map((q, idx) => {
                    const isCorrect = q.userAnswer === q.correctOption;
                    const isUnanswered = q.userAnswer === null || q.userAnswer === undefined;
                    const userLetter = !isUnanswered ? String.fromCharCode(65 + q.userAnswer) : 'Not answered';
                    const correctLetter = String.fromCharCode(65 + q.correctOption);
                    
                    let statusClass = 'wrong', statusText = '❌ Wrong';
                    if (isCorrect) { statusClass = 'correct'; statusText = '✅ Correct'; }
                    if (isUnanswered) { statusClass = 'unanswered'; statusText = '⬜ Unanswered'; }
                    
                    let optionsHtml = '';
                    if (q.options && q.options.length) {
                        optionsHtml = '<div class="options">';
                        q.options.forEach((opt, optIdx) => {
                            let optClass = '';
                            if (optIdx === q.correctOption) optClass = 'correct-answer';
                            if (optIdx === q.userAnswer && optIdx !== q.correctOption) optClass = 'user-wrong';
                            const icon = optIdx === q.correctOption ? '✓' : (optIdx === q.userAnswer && optIdx !== q.correctOption ? '✗' : '');
                            optionsHtml += `<div class="option ${optClass}"><span class="option-icon">${icon}</span>${String.fromCharCode(65+optIdx)}. <span class="mathjax-process">${opt}</span></div>`;
                        });
                        optionsHtml += `</div>`;
                        optionsHtml += `<div class="answer-row">Your answer: <strong style="color:${isCorrect ? 'var(--success)' : isUnanswered ? 'var(--warning)' : 'var(--danger)'}">${userLetter}</strong> | Correct: <strong style="color:var(--success)">${correctLetter}</strong></div>`;
                    }
                    
                    let explanationHtml = '';
                    if (q.explanation && q.explanation.trim()) {
                        explanationHtml = `<div class="explanation"><i class="fas fa-info-circle"></i> <span class="mathjax-process">${q.explanation}</span></div>`;
                    }
                    
                    return `<div class="question-review ${isCorrect ? 'correct' : isUnanswered ? 'unanswered' : 'wrong'}">
                        <div class="question-header">
                            <div class="question-text mathjax-process">${idx + 1}. ${q.text}</div>
                            <span class="question-status ${statusClass}">${statusText}</span>
                        </div>
                        ${optionsHtml}
                        ${explanationHtml}
                    </div>`;
                }).join('');
            } else {
                questionsHtml = `<p style="color:var(--text2);text-align:center;padding:20px">📋 Detailed question review not available for this session.</p>`;
            }
            
            const html = `
                <div class="result-card">
                    <div style="text-align:center"><span class="mode-badge ${modeClass}">${modeLabel}</span></div>
                    <div class="result-title" style="justify-content:center">
                        <i class="fas ${isExam ? 'fa-file-alt' : 'fa-flask'}" style="color:${isExam ? 'var(--primary-light)' : '#a78bfa'}"></i>
                        ${result.course || 'Results'}
                    </div>
                    <div class="score-circle ${scoreClass}">${percentage}%<span class="grade">Grade: ${grade}</span></div>
                    <div class="encouragement ${encClass}">${encMessage}</div>
                    <div class="stats-grid">
                        <div class="stat-item"><div class="stat-value">${result.correctCount || 0}/${result.totalQuestions || 0}</div><div class="stat-label">✅ Correct/Total</div></div>
                        <div class="stat-item"><div class="stat-value">${timeString}</div><div class="stat-label">⏱️ Time Spent</div></div>
                        <div class="stat-item"><div class="stat-value">${result.totalQuestions ? Math.round((result.correctCount / result.totalQuestions) * 100) : 0}%</div><div class="stat-label">📊 Accuracy</div></div>
                        <div class="stat-item"><div class="stat-value">${isExam ? 'Exam' : 'Test'}</div><div class="stat-label">📋 Mode</div></div>
                    </div>
                </div>
                <div class="result-card">${questionsHtml}</div>
                <div class="action-buttons">
                    <a href="/exam" class="btn btn-primary"><i class="fas fa-pen"></i> Take Exam</a>
                    <a href="/test" class="btn btn-test"><i class="fas fa-flask"></i> Practice Test</a>
                    <a href="/app" class="btn btn-outline"><i class="fas fa-home"></i> Dashboard</a>
                </div>
            `;
            
            document.getElementById('resultContent').innerHTML = html;
            document.getElementById('resultContent').style.display = 'block';
            
            // Trigger MathJax to process new content
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([document.getElementById('resultContent')]).catch(console.error);
            }
        }

        // ==================== INIT ====================
        initTheme();
        loadResult();
    </script>
</body>
</html>
